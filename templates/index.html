<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Denver Precinct Map</title>
<link rel="stylesheet" href="{{ url_for('static', filename='leaflet/leaflet.css') }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232f6fa8'/%3E%3Cpath d='M6 20l7-11 6 8 3-4 4 7z' fill='%23cfe2f0'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#1c2430; --muted:#6b7684; --line:#dde3ea; --panel:#ffffff;
    --accent:#2f6fa8; --accent-soft:#4a90c4;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink)}
  #map{position:absolute;inset:0;background:#eef1f4}

  .panel{
    position:absolute;top:14px;left:14px;z-index:1000;width:268px;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 6px 24px rgba(20,30,45,.12);overflow:hidden;
  }
  .panel h1{margin:0;padding:13px 15px 11px;font-size:15px;font-weight:650;letter-spacing:.1px;
    border-bottom:1px solid var(--line)}
  .panel h1 span{display:block;font-size:11.5px;font-weight:450;color:var(--muted);margin-top:2px;letter-spacing:.2px}
  .panel .body{padding:12px 15px 14px}
  .search{display:flex;gap:7px}
  .search input{
    flex:1;min-width:0;padding:8px 10px;font-size:14px;font-family:inherit;color:var(--ink);
    border:1px solid var(--line);border-radius:6px;background:#fbfcfd;outline:none;
  }
  .search input:focus{border-color:var(--accent-soft);background:#fff;box-shadow:0 0 0 3px rgba(74,144,196,.15)}
  .search button{
    padding:8px 12px;font-size:13px;font-family:inherit;font-weight:550;color:#fff;
    background:var(--accent);border:0;border-radius:6px;cursor:pointer;
  }
  .search button:hover{background:#27608f}
  .note{margin-top:9px;font-size:12px;color:var(--muted);min-height:16px}
  .note.err{color:#b03a3a}

  .leaflet-popup-content-wrapper{border-radius:9px;box-shadow:0 8px 28px rgba(20,30,45,.18)}
  .leaflet-popup-content{margin:0;width:auto!important}
  .pop{padding:13px 16px 14px;min-width:210px}
  .pop .num{font-size:27px;font-weight:680;letter-spacing:-.5px;line-height:1.05}
  .pop .lbl{font-size:10.5px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .pop .hood{margin-top:3px;font-size:13px;color:#48525f}
  .pop .stat{margin:11px 0 0;padding:8px 10px;background:#f2f6fa;border-radius:6px;
    display:flex;align-items:baseline;gap:7px}
  .pop .stat .v{font-size:17px;font-weight:660;font-variant-numeric:tabular-nums;color:#23557f}
  .pop .stat .k{font-size:11.5px;color:var(--muted)}
  .pop .stat.none{display:block;font-size:11.5px;color:#98a2ae;background:#f6f7f9}
  .pop .dir{margin-top:9px;font-size:12px;color:#48525f}
  .pop dl{display:grid;grid-template-columns:auto auto;gap:4px 14px;margin:11px 0 0;
    padding-top:10px;border-top:1px solid var(--line);font-size:12.5px}
  .pop dt{color:var(--muted)}
  .pop dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
  .pop .code{margin-top:9px;font-size:11px;color:#98a2ae;font-variant-numeric:tabular-nums}

  .leaflet-container{font:inherit}
  .leaflet-control-attribution{font-size:10.5px}

  @media (max-width:560px){
    .panel{width:auto;left:10px;right:10px;top:10px}
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="panel">
  <h1>Denver Precincts<span id="count">Loading precincts…</span></h1>
  <div class="body">
    <form class="search" id="searchForm" autocomplete="off">
      <input id="q" type="text" inputmode="numeric" placeholder="Precinct number, e.g. 214" aria-label="Precinct number">
      <button type="submit">Find</button>
    </form>
    <div class="note" id="note">Click any precinct to see its number.</div>
  </div>
</div>

<script src="{{ url_for('static', filename='leaflet/leaflet.js') }}"></script>
<script>
(function () {
  "use strict";

  var note = document.getElementById("note");
  function say(msg, isErr) {
    note.textContent = msg;
    note.className = isErr ? "note err" : "note";
    if (isErr) console.error("[precinct-map] " + msg);
  }

  var map = L.map("map", {
    center: [39.7325, -104.9540],
    zoom: 11,
    minZoom: 9,
    maxZoom: 18,
    zoomControl: true,
    preferCanvas: true
  });

  L.control.scale({ imperial: true, metric: false, position: "bottomleft" }).addTo(map);

  L.tileLayer(
    "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
    {
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, ' +
        '&copy; <a href="https://carto.com/attributions">CARTO</a> | Precincts: Denver Open Data',
      subdomains: "abcd",
      maxZoom: 20,
      opacity: 0.85
    }
  ).addTo(map);

  var BASE = { color: "#2f6fa8", weight: 1, opacity: 0.85, fillColor: "#4a90c4", fillOpacity: 0.16 };
  var HOVER = { weight: 2, color: "#1d5687", fillOpacity: 0.30 };
  var PICKED = { weight: 2.5, color: "#b4531f", fillColor: "#e08b3e", fillOpacity: 0.42 };

  var byNumber = {};
  var picked = null;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function commas(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }

  function popupHtml(p) {
    var rows = [
      ["School Board", p.school_board],
      ["City Council", p.council],
      ["State House", p.house],
      ["State Senate", p.senate],
      ["Congress", p.cong]
    ].filter(function (r) { return r[1]; });

    var voters =
      typeof p.registered === "number"
        ? '<div class="stat"><span class="v">' + commas(p.registered) +
          '</span><span class="k">registered voters</span></div>'
        : '<div class="stat none">Registered voter count not loaded</div>';

    return (
      '<div class="pop">' +
        '<div class="lbl">Precinct</div>' +
        '<div class="num">' + esc(p.precinct) + "</div>" +
        (p.neighborhood ? '<div class="hood">' + esc(p.neighborhood) + "</div>" : "") +
        voters +
        (rows.length
          ? "<dl>" + rows.map(function (r) {
              return "<dt>" + r[0] + "</dt><dd>" + esc(r[1]) + "</dd>";
            }).join("") + "</dl>"
          : "") +
        (p.school_board_director
          ? '<div class="dir">Director ' + esc(p.school_board_director) + "</div>"
          : "") +
        (p.precinct_code ? '<div class="code">Code ' + esc(p.precinct_code) + "</div>" : "") +
      "</div>"
    );
  }

  function selectLayer(layer, fly) {
    if (picked && picked !== layer) layers.resetStyle(picked);
    picked = layer;
    layer.setStyle(PICKED);
    layer.bringToFront();
    if (fly) map.flyToBounds(layer.getBounds(), { padding: [70, 70], maxZoom: 15, duration: 0.6 });
    layer.openPopup();
  }

  var layers = L.geoJSON(null, {
    style: function () { return BASE; },
    onEachFeature: function (feature, layer) {
      var p = feature.properties || {};
      byNumber[String(p.precinct)] = layer;
      layer.bindPopup(popupHtml(p), { closeButton: true, autoPanPadding: [30, 30] });
      layer.bindTooltip(String(p.precinct), { sticky: true, direction: "top", opacity: 0.9 });
      layer.on({
        mouseover: function () { if (layer !== picked) { layer.setStyle(HOVER); layer.bringToFront(); } },
        mouseout:  function () { if (layer !== picked) layers.resetStyle(layer); },
        click:     function () { selectLayer(layer, false); }
      });
    }
  }).addTo(map);

  fetch("/data/precincts.geojson", { cache: "force-cache" })
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status + " loading precincts.geojson");
      return res.json();
    })
    .then(function (geo) {
      layers.addData(geo);
      var n = (geo.features || []).length;
      document.getElementById("count").textContent =
        n + " precinct" + (n === 1 ? "" : "s") + " · Denver County";
      map.fitBounds(layers.getBounds(), { padding: [20, 20] });
      say("Click any precinct to see its number.");
    })
    .catch(function (err) {
      document.getElementById("count").textContent = "Precinct data unavailable";
      say("Could not load precinct boundaries. " + err.message, true);
    });

  document.getElementById("searchForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var q = document.getElementById("q").value.trim();
    if (!q) { say("Enter a precinct number."); return; }
    var layer = byNumber[q];
    if (!layer) { say("No precinct " + q + " in Denver County.", true); return; }
    say("Showing precinct " + q + ".");
    selectLayer(layer, true);
  });
})();
</script>
</body>
</html>
