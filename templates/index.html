<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Denver Precinct Map</title>
<link rel="stylesheet" href="{{ url_for('static', filename='leaflet/leaflet.css') }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232f6fa8'/%3E%3Cpath d='M6 20l7-11 6 8 3-4 4 7z' fill='%23cfe2f0'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#1c2430; --muted:#6b7684; --line:#dde3ea; --panel:#ffffff;
    --accent:#2f6fa8; --accent-soft:#4a90c4; --wash:#f2f6fa;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink)}
  #map{position:absolute;inset:0;background:#eef1f4}

  .panel{
    position:absolute;top:14px;left:14px;z-index:1000;width:286px;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 6px 24px rgba(20,30,45,.12);display:flex;flex-direction:column;
    /* Everything lives in this one panel now, so cap it well short of the
       viewport and let the body scroll. Otherwise it swallows the map. */
    max-height:min(calc(100vh - 28px), 74vh);
  }
  .panel h1{margin:0;padding:13px 15px 11px 15px;font-size:15px;font-weight:650;letter-spacing:.1px;
    flex:none;position:relative}
  .panel h1 span#count{display:block;font-size:11.5px;font-weight:450;color:var(--muted);
    margin-top:2px;letter-spacing:.2px}
  .panel h1 .hactions{position:absolute;top:10px;right:10px;display:flex;align-items:center;gap:7px}
  .panel h1 #toggle{width:26px;height:26px;padding:0;
    display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);
    background:#fff;border:1px solid var(--line);border-radius:6px;cursor:pointer;line-height:1}
  .panel h1 #toggle:hover{border-color:var(--accent-soft);color:var(--accent)}
  .panel h1 .link{padding:0 2px;font:inherit;font-size:12.5px;font-weight:500;
    color:var(--accent);background:none;border:0;cursor:pointer;text-decoration:underline;
    text-underline-offset:2px}
  .panel h1 .link:hover{color:#27608f}
  .panel h1 button #chev{transition:transform .18s ease}
  .panel.collapsed h1 button #chev{transform:rotate(-90deg)}
  .panel .note{padding:0 15px 11px;border-bottom:1px solid var(--line);flex:none}
  .panel .note[hidden]{display:none}
  .panel.collapsed .note[hidden] + .body{border-top:0}
  .panel.collapsed .note{border-bottom:0;padding-bottom:13px}
  .panel.collapsed .btnrow.always{padding-bottom:13px}
  .panel.collapsed .note:not([hidden]) ~ .btnrow.always{padding-bottom:13px}
  .panel .body{padding:12px 15px 14px;overflow-y:auto}
  .panel.collapsed .body{display:none}

  .search{display:flex;gap:7px}
  .search input{
    flex:1;min-width:0;padding:8px 10px;font-size:14px;font-family:inherit;color:var(--ink);
    border:1px solid var(--line);border-radius:6px;background:#fbfcfd;outline:none;
  }
  .search input:focus{border-color:var(--accent-soft);background:#fff;box-shadow:0 0 0 3px rgba(74,144,196,.15)}
  .search button{
    padding:8px 12px;font-size:13px;font-family:inherit;font-weight:550;color:#fff;
    background:var(--accent);border:0;border-radius:6px;cursor:pointer;white-space:nowrap;
  }
  .search button:hover{background:#27608f}
  .search button:disabled{background:#9db6cb;cursor:default}
  .note{font-size:12px;color:var(--muted);min-height:16px}
  .note.err{color:#b03a3a}

  .sec{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .sec.first{margin-top:12px}
  .sec h2{margin:0 0 9px;font-size:10.5px;font-weight:600;letter-spacing:.9px;
    text-transform:uppercase;color:var(--muted)}
  .sec.fold h2{margin:0}
  .sec.fold h2 button{display:flex;align-items:center;justify-content:space-between;
    width:100%;padding:2px 0;font:inherit;letter-spacing:inherit;text-transform:inherit;
    color:inherit;background:none;border:0;cursor:pointer}
  .sec.fold h2 button:hover{color:var(--accent)}
  .sec.fold h2 .fc{font-size:11px;transition:transform .18s ease}
  .sec.fold.closed h2 .fc{transform:rotate(-90deg)}
  .sec.fold:not(.closed) h2{margin-bottom:7px}
  .sec.fold.closed .rows,
  .sec.fold.closed .legend,
  .sec.fold.closed .dist{display:none}
  .btnrow{display:flex;gap:7px;margin-bottom:10px}
  .btnrow.always{margin:0;padding:0 15px 11px;flex:none}
  .btnrow button{
    flex:1;padding:7px 8px;font-size:12.5px;font-family:inherit;font-weight:550;
    color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;cursor:pointer;
  }
  .btnrow button:hover{border-color:var(--accent-soft);background:var(--wash)}
  .btnrow button.on{background:var(--accent);border-color:var(--accent);color:#fff}

  .dist{display:grid;grid-template-columns:88px 1fr;gap:5px 8px;align-items:center}
  .dist label{font-size:12px;color:#48525f}
  .dist select{
    width:100%;padding:4px 6px;font-size:12.5px;font-family:inherit;color:var(--ink);
    border:1px solid var(--line);border-radius:5px;background:#fbfcfd;outline:none;cursor:pointer;
  }
  .dist select:focus{border-color:var(--accent-soft);background:#fff}

  /* Precinct details live in a bar along the bottom so the shape itself
     is never covered by a floating window. */
  .detail{
    position:absolute;left:14px;right:14px;bottom:14px;z-index:1000;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 6px 24px rgba(20,30,45,.14);
    padding:12px 44px 12px 16px;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  }
  .detail[hidden]{display:none}
  .detail #detailClose{
    position:absolute;top:8px;right:9px;width:26px;height:26px;padding:0;
    font-size:17px;line-height:1;color:var(--muted);background:#fff;
    border:1px solid var(--line);border-radius:6px;cursor:pointer;
  }
  .detail #detailClose:hover{border-color:var(--accent-soft);color:var(--accent)}
  .d-id{display:flex;align-items:baseline;gap:9px;flex:none}
  .d-lbl{font-size:10.5px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--muted)}
  .d-num{font-size:25px;font-weight:680;letter-spacing:-.5px;line-height:1}
  .d-hood{font-size:13px;color:#48525f}
  .d-stat{display:flex;align-items:baseline;gap:8px;flex:none;
    padding:7px 12px;background:var(--wash);border-radius:6px}
  .d-stat .v{font-size:17px;font-weight:660;font-variant-numeric:tabular-nums;color:#23557f}
  .d-stat .k{font-size:11.5px;color:var(--muted)}
  .d-stat .sub{font-size:11px;color:#8b95a2;font-variant-numeric:tabular-nums}
  .d-stat.none{display:block;font-size:11.5px;color:#98a2ae;background:#f6f7f9}
  .d-rows{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:12.5px;flex:1 1 auto;min-width:0}
  .d-rows .r{display:flex;gap:6px;align-items:baseline;white-space:nowrap}
  .d-rows .r b{font-weight:600;font-variant-numeric:tabular-nums}
  .d-rows .r .was{color:var(--muted);font-size:11.5px}
  .d-rows .r span{color:var(--muted)}
  .d-code{font-size:11px;color:#98a2ae;font-variant-numeric:tabular-nums;flex:none}
  /* keep Leaflet's scale bar and attribution clear of the detail bar */
  body.has-detail .leaflet-bottom{bottom:86px}

  .modal{position:absolute;inset:0;z-index:1200;display:flex;align-items:center;
    justify-content:center;background:rgba(20,30,45,.35);padding:20px}
  .modal[hidden]{display:none}
  .modal .sheet{position:relative;width:min(440px,100%);background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:20px 22px 18px;
    box-shadow:0 16px 48px rgba(20,30,45,.28)}
  .modal h2{margin:0 0 4px;font-size:16px;font-weight:650}
  .modal .what{margin:0 0 14px;font-size:12.5px;color:var(--muted)}
  .modal .row{display:flex;gap:8px}
  .modal input{flex:1;min-width:0;padding:9px 11px;font:inherit;font-size:13px;
    color:var(--ink);border:1px solid var(--line);border-radius:6px;background:#fbfcfd}
  .modal input:focus{outline:none;border-color:var(--accent-soft);
    box-shadow:0 0 0 3px rgba(74,144,196,.15)}
  .modal .row button{padding:9px 15px;font:inherit;font-size:13px;font-weight:550;
    color:#fff;background:var(--accent);border:0;border-radius:6px;cursor:pointer}
  .modal .row button:hover{background:#27608f}
  .modal .row button.ok{background:#15803d}
  .modal .hint{margin:11px 0 0;font-size:11.5px;color:#98a2ae}
  .modal #shareClose{position:absolute;top:12px;right:12px;width:26px;height:26px;
    padding:0;font-size:17px;line-height:1;color:var(--muted);background:#fff;
    border:1px solid var(--line);border-radius:6px;cursor:pointer}
  .modal #shareClose:hover{border-color:var(--accent-soft);color:var(--accent)}

  .leaflet-container{font:inherit}
  .muted-tiles{filter:grayscale(.85) brightness(1.06) contrast(.92)}
  body.has-detail .panel{max-height:min(calc(100vh - 42px - var(--detail-h, 72px)), 66vh)}
  .rows{display:flex;flex-direction:column;gap:1px}
  .rows label{display:flex;align-items:center;gap:8px;padding:3.5px 6px;
    font-size:13px;border-radius:5px;cursor:pointer;user-select:none}
  .rows label:hover{background:var(--wash)}
  .rows input{margin:0;flex:none;accent-color:var(--accent);cursor:pointer}
  .rows .swatch{display:inline-block;width:16px;height:4px;border-radius:2px;flex:none}
  .rows .nosw{width:16px;flex:none}

  .leaflet-control-zoom{border-radius:8px;border:1px solid var(--line);
    box-shadow:0 4px 16px rgba(20,30,45,.12);overflow:hidden}
  .leaflet-control-zoom a{color:var(--ink);border-bottom-color:var(--line)}
  .leaflet-control-zoom a:hover{background:var(--wash);color:var(--accent)}
  .leaflet-touch .leaflet-control-zoom{border:1px solid var(--line)}
  .leaflet-control-layers-list{font-size:13px;padding:4px 2px}
  .leaflet-control-layers .swatch{display:inline-block;width:14px;height:4px;
    border-radius:2px;margin:0 6px 0 2px;vertical-align:middle}
  /* Big district labels. The halo keeps them legible over streets and parks. */
  .dlabel{
    position:absolute;transform:translate(-50%,-50%);
    font:800 30px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    letter-spacing:-.5px;white-space:nowrap;
    -webkit-text-stroke:5px rgba(255,255,255,.92);paint-order:stroke fill;
    text-shadow:0 1px 2px rgba(255,255,255,.9);
  }
  .dlabel.small{font-size:13px;font-weight:700;letter-spacing:0;
    -webkit-text-stroke-width:3.5px}
  @media (max-width:700px){
    .dlabel{font-size:24px;-webkit-text-stroke-width:4px}
    .dlabel.small{font-size:12px;-webkit-text-stroke-width:3px}
  }
  .leaflet-control-attribution{font-size:10.5px}
  /* While drawing a box, the precinct layer must not hit-test at all, or every
     pass of the cursor lights up a precinct and pops its number tooltip. */
  .boxzoom-on{cursor:crosshair!important;touch-action:none}
  .boxzoom-on .leaflet-overlay-pane{pointer-events:none!important}
  .boxzoom-on .leaflet-interactive{pointer-events:none!important;cursor:crosshair!important}
  .boxzoom-on .leaflet-tooltip{display:none!important}
  /* the number is already painted on the precinct, so drop the hover chip */
  .pnum-on .leaflet-tooltip{display:none!important}
  .addr-pin{border:2px solid #b4531f;background:rgba(224,139,62,.35);border-radius:50%}
  .verbadge{background:rgba(255,255,255,.85);border-radius:3px;padding:1px 6px;
            font-size:10.5px;line-height:1.5;color:#7a828c;font-variant-numeric:tabular-nums;
            box-shadow:0 0 0 1px rgba(0,0,0,.06)}

  /* election legend, under the contest picker */
  .legend{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
  .legend .lg-title{font-size:11px;color:var(--muted);margin-bottom:6px;line-height:1.35}
  .legend .lg-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .legend .lg-ramp{display:flex;flex:none;border:1px solid rgba(0,0,0,.18);border-radius:3px;overflow:hidden}
  .legend .lg-ramp i{display:block;width:16px;height:12px}
  .legend .lg-name{font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .legend .lg-name b{font-weight:600}
  .legend .lg-n{color:var(--muted);font-variant-numeric:tabular-nums}
  .legend .lg-scale{margin:0 0 7px;font-size:10.5px;color:var(--muted);line-height:1.4}
  .legend .lg-bar{position:relative;height:11px;border-radius:3px;overflow:hidden;
                  border:1px solid rgba(0,0,0,.18)}
  .legend .lg-bar i{position:absolute;left:0;top:0;bottom:0;width:0;
                    background:rgba(246,247,249,.82);border-right:1px solid rgba(0,0,0,.22)}
  .legend .lg-ends{display:flex;justify-content:space-between;margin-top:3px;
                   font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
  /* sits directly under the ramp so the handle reads against the colour it cuts */
  .legend .lg-slider{-webkit-appearance:none;appearance:none;display:block;
                     width:100%;margin:5px 0 0;background:transparent;cursor:ew-resize}
  .legend .lg-slider:focus{outline:none}
  .legend .lg-slider::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:var(--line)}
  .legend .lg-slider::-moz-range-track{height:3px;border-radius:2px;background:var(--line)}
  .legend .lg-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
      width:14px;height:14px;margin-top:-5.5px;border-radius:50%;
      background:#2d5a85;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .legend .lg-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;
      background:#2d5a85;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .legend .lg-cutline{display:flex;justify-content:space-between;align-items:baseline;
                      gap:8px;margin-top:6px;font-size:11.5px}
  .legend .lg-cutline b{font-weight:600;font-variant-numeric:tabular-nums}
  .legend .lg-cutline .n{color:var(--muted);font-variant-numeric:tabular-nums}
  .legend .lg-cutline button{border:0;background:none;padding:0;font:inherit;
      font-size:11px;color:var(--accent);text-decoration:underline;cursor:pointer}
  .d-elect{display:flex;align-items:baseline;gap:7px;flex:none;font-size:12.5px;
           white-space:nowrap;padding-right:14px;border-right:1px solid var(--line)}
  .d-elect .k{font-size:11px;color:var(--muted)}
  .d-elect b{font-weight:600}
  .d-elect .sw{width:11px;height:11px;border-radius:2px;border:1px solid rgba(0,0,0,.2);
               display:inline-block;position:relative;top:1px}

  @media (max-width:700px){
    /* keep clear of the zoom buttons in the top-right corner. The layer
       sections fold away, so the panel can afford more height here. */
    .panel{width:auto;left:10px;right:64px;top:10px;max-height:76vh}
    .detail{left:10px;right:10px;bottom:10px;gap:10px;padding:11px 40px 11px 13px}
    .d-num{font-size:21px}
    body.has-detail .leaflet-bottom{bottom:150px}
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="panel">
  <h1>
    <span class="hactions">
      <button type="button" id="share" class="link">Share</button>
      <button type="button" id="reset" class="link">Reset</button>
      <button type="button" id="toggle" aria-expanded="true" aria-controls="panelBody"
              title="Show or hide the controls"><span id="chev">&#9662;</span></button>
    </span>
    Denver Precincts<span id="count">Loading precincts…</span>
  </h1>
  <div class="btnrow always">
    <button type="button" id="zoomDenver">Denver</button>
    <button type="button" id="boxBtn">Box zoom</button>
  </div>
  <div class="note" id="note">Click any precinct to zoom in and see its details.</div>
  <div class="body" id="panelBody">
    <form class="search" id="searchForm" autocomplete="off">
      <input id="q" type="text" placeholder="Address or precinct number" aria-label="Address or precinct number">
      <button type="submit" id="findBtn">Find</button>
    </form>

    <div class="sec first fold closed" id="distSec">
      <h2><button type="button" aria-expanded="false">Zoom to a district<span class="fc">&#9662;</span></button></h2>
      <div class="dist">
        <label for="dCouncil">City Council</label><select id="dCouncil"></select>
        <label for="dSchool">School Board</label><select id="dSchool"></select>
        <label for="dRtd">RTD</label><select id="dRtd"></select>
        <label for="dSenate">State Senate</label><select id="dSenate"></select>
        <label for="dHouse">State House</label><select id="dHouse"></select>
      </div>
    </div>

    <div class="sec fold closed" id="electSec">
      <h2><button type="button" aria-expanded="false">School Board Elections<span class="fc">&#9662;</span></button></h2>
      <div class="rows" id="electRows"></div>
      <div class="legend" id="electLegend" hidden></div>
    </div>

    <div class="sec fold closed" id="returnSec">
      <h2><button type="button" aria-expanded="false">Ballot Returns<span class="fc">&#9662;</span></button></h2>
      <div class="rows" id="returnRows"></div>
      <div class="legend" id="returnLegend" hidden></div>
    </div>

    <div class="sec fold closed">
      <h2><button type="button" aria-expanded="false">Basemap<span class="fc">&#9662;</span></button></h2>
      <div class="rows" id="baseRows"></div>
    </div>

    <div class="sec fold closed">
      <h2><button type="button" aria-expanded="false">Boundaries<span class="fc">&#9662;</span></button></h2>
      <div class="rows" id="overlayRows"></div>
    </div>

    <div class="sec fold closed">
      <h2><button type="button" aria-expanded="false">Labels<span class="fc">&#9662;</span></button></h2>
      <div class="rows" id="labelRows"></div>
    </div>
  </div>
</div>

<div class="modal" id="shareModal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
    <button type="button" id="shareClose" aria-label="Close">&times;</button>
    <h2 id="shareTitle">Share this view</h2>
    <p class="what" id="shareWhat"></p>
    <div class="row">
      <input id="shareUrl" type="text" readonly aria-label="Shareable link">
      <button type="button" id="shareCopy">Copy</button>
    </div>
    <p class="hint" id="shareHint">Anyone with the link opens the map exactly as you have it now.</p>
  </div>
</div>

<div class="detail" id="detail" hidden>
  <button type="button" id="detailClose" aria-label="Close precinct details">&times;</button>
  <div class="d-id">
    <span class="d-lbl">Precinct</span>
    <span class="d-num" id="dNum"></span>
    <span class="d-hood" id="dHood"></span>
  </div>
  <div class="d-stat" id="dStat"></div>
  <div class="d-elect" id="dElect" hidden></div>
  <div class="d-elect" id="dReturn" hidden></div>
  <div class="d-rows" id="dRows"></div>
  <div class="d-code" id="dCode"></div>
</div>

<script src="{{ url_for('static', filename='leaflet/leaflet.js') }}"></script>
<script>
(function () {
  "use strict";

  var note = document.getElementById("note");
  var panel = document.querySelector(".panel");
  var toggle = document.getElementById("toggle");

  function setCollapsed(on) {
    panel.classList.toggle("collapsed", on);
    toggle.setAttribute("aria-expanded", on ? "false" : "true");
  }
  toggle.addEventListener("click", function () {
    setCollapsed(!panel.classList.contains("collapsed"));
  });

  // Once a setting has been changed the panel has done its job, so the next
  // touch of the map folds it away instead of leaving it over the county.
  function collapseOnMapUse() {
    if (!panel.classList.contains("collapsed")) setCollapsed(true);
  }

  function say(msg, isErr) {
    note.textContent = msg || "";
    note.className = isErr ? "note err" : "note";
    note.hidden = !msg;
    if (isErr) console.error("[precinct-map] " + msg);
  }
  function commas(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  var map = L.map("map", {
    center: [39.7325, -104.954],
    zoom: 11, minZoom: 9, maxZoom: 18,
    zoomControl: false, preferCanvas: true
  });
  // bottom-left is the layers panel now, so the scale goes right
  L.control.scale({ imperial: true, metric: false, position: "bottomright" }).addTo(map);

  // A build number in the corner, so it is obvious whether the browser is
  // showing the current deploy or a cached copy of an older one.
  var VersionBadge = L.Control.extend({
    onAdd: function () {
      var el = L.DomUtil.create("div", "verbadge");
      el.textContent = "v{{ version }}";
      el.title = "Build {{ version }}";
      return el;
    }
  });
  new VersionBadge({ position: "bottomright" }).addTo(map);

  // District outlines live in their own pane above the precinct canvas, so a
  // selected precinct brought to the front can never cover them, and so they
  // never intercept a click meant for the precinct underneath.
  map.createPane("mask");
  map.getPane("mask").style.zIndex = 350;
  map.getPane("mask").style.pointerEvents = "none";
  map.createPane("districts");
  map.getPane("districts").style.zIndex = 450;
  map.getPane("districts").style.pointerEvents = "none";
  map.createPane("districtLabels");
  map.getPane("districtLabels").style.zIndex = 460;
  map.getPane("districtLabels").style.pointerEvents = "none";

  // ---- basemaps (both key-free) ---------------------------------------
  var ESRI_ATTR =
    'Tiles &copy; <a href="https://www.esri.com/">Esri</a> | ' +
    "Precincts: Denver Open Data | Voters: CO Secretary of State";
  // Base only, no reference layer. Esri's label tiles stop at zoom 16, so
  // past that every place name was being upscaled into a blurry smear over
  // the precincts. Street detail (OSM) is the option when names are wanted.
  var esriGray = L.layerGroup([
    L.tileLayer(
      "https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/" +
        "World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",
      { attribution: ESRI_ATTR, maxNativeZoom: 16, maxZoom: 18 }
    )
  ]);
  var osmMuted = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution:
      '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> ' +
      "contributors | Precincts: Denver Open Data | Voters: CO Secretary of State",
    maxZoom: 19, className: "muted-tiles"
  });
  // "No basemap" is a real, empty layer: precincts on a flat ground, no streets.
  var blank = L.layerGroup([]);

  esriGray.addTo(map);

  // Leaflet's own layers control is a small icon in the corner that people
  // miss, so basemaps, boundaries and labels are rows in the one panel.

  var BASEMAPS = [
    { label: "Muted gray", layer: esriGray },
    { label: "Street detail", layer: osmMuted },
    { label: "No basemap", layer: blank }
  ];

  (function buildBasemapRows() {
    var host = document.getElementById("baseRows");
    BASEMAPS.forEach(function (b, i) {
      var row = document.createElement("label");
      var input = document.createElement("input");
      input.type = "radio";
      input.name = "basemap";
      input.checked = map.hasLayer(b.layer);
      input.addEventListener("change", function () {
        BASEMAPS.forEach(function (o) {
          if (map.hasLayer(o.layer)) map.removeLayer(o.layer);
        });
        map.addLayer(b.layer);
      });
      row.appendChild(input);
      var sw = document.createElement("span");
      sw.className = "nosw";
      row.appendChild(sw);
      row.appendChild(document.createTextNode(b.label));
      host.appendChild(row);
    });
  })();

  // Stands in for layerControl.addOverlay: one checkbox row per overlay.
  function addOverlay(layer, label, color, hostId) {
    var host = document.getElementById(hostId || "overlayRows");
    var row = document.createElement("label");
    var input = document.createElement("input");
    input.type = "checkbox";
    input.checked = map.hasLayer(layer);
    input.addEventListener("change", function () {
      if (input.checked) map.addLayer(layer);
      else map.removeLayer(layer);
    });
    row.appendChild(input);
    var sw = document.createElement("span");
    if (color) {
      sw.className = "swatch";
      sw.style.background = color;
    } else {
      sw.className = "nosw";
    }
    row.appendChild(sw);
    row.appendChild(document.createTextNode(label));
    host.appendChild(row);
    // keep the boxes honest when a shared link changes layers programmatically
    map.on("layeradd layerremove", function () {
      input.checked = map.hasLayer(layer);
    });
  }

  // Added after the layers control so it stacks directly beneath it.
  L.control.zoom({ position: "topright", zoomInTitle: "Zoom in", zoomOutTitle: "Zoom out" }).addTo(map);

  // A click anywhere on the map, precincts included, closes the panel. Not
  // while a box is being drawn: that click is the box, and the panel bar
  // holds the Cancel button.
  map.on("click", function () { if (!boxOn) collapseOnMapUse(); });

  // ---- precinct layer --------------------------------------------------
  // stroke and fill are spelled out on every visible style: the returns slider
  // hides a precinct by turning both off, and setStyle merges, so a style that
  // stays silent about them would leave it hidden.
  var SHOWN = { stroke: true, fill: true };
  var HIDDEN = { stroke: false, fill: false };
  var BASE = { stroke: true, fill: true, color: "#2f6fa8", weight: 1, opacity: .85, fillColor: "#4a90c4", fillOpacity: .16 };
  var HOVER = { stroke: true, fill: true, weight: 2, color: "#1d5687", fillOpacity: .30 };
  var PICKED = { stroke: true, fill: true, weight: 2.5, color: "#b4531f", fillColor: "#e08b3e", fillOpacity: .42 };
  var IN_DIST = { stroke: true, fill: true, color: "#22557f", weight: 1.2, opacity: .9, fillColor: "#3f86bd", fillOpacity: .34 };
  var DIMMED = { stroke: true, fill: true, color: "#b9c3cd", weight: .7, opacity: .7, fillColor: "#c9d2db", fillOpacity: .10 };

  // When a district is chosen, its precincts stay saturated and the rest dim.
  var filterKey = null, filterVal = null;

  // ---- election choropleth ----------------------------------------------
  // Denver reports a precinct's result as the leading candidate plus a 25%
  // band, never an exact count, so the map can only be four steps deep. One
  // ramp per candidate, darkest at the top band, following the Tableau viz
  // these numbers come from. Slot 0 goes to whoever led the most precincts.
  var RAMPS = [
    ["#c6dbef", "#82badb", "#3182bd", "#08519c"],   // blue
    ["#fdd9a8", "#fdae6b", "#e6550d", "#a63603"],   // orange
    ["#c7e9c0", "#a1d99b", "#41ab5d", "#006d2c"],   // green
    ["#dadaeb", "#bcbddc", "#807dba", "#54278f"]    // purple
  ];
  var TIED_COLOR = "#9aa1a8";

  var elections = null;      // { bands: [...], contests: [...] }
  var contest = null;        // the contest currently shaded, or null

  // ---- ballot returns ----------------------------------------------------
  // Returns are a real rate rather than a 25% band, so this is a continuous
  // ramp. The stops are Denver's own, sampled straight off the legend of the
  // election dashboard these exports come from: Tableau's Blue-Teal, pale mint
  // at the low end to deep blue at the high.
  var RETURN_RAMP = ["#bce4d8", "#a4d7d3", "#8dcace", "#76bdc8", "#5fb1c1",
                     "#46a3b9", "#3993b2", "#3585a7", "#33769b", "#316792",
                     "#2d5a85"];
  var returns = null;        // { elections: [...] }
  var returnYear = null;     // the election currently shaded, or null
  var returnMin = null;      // hide precincts returning below this rate

  function rampColor(t) {
    t = t < 0 ? 0 : (t > 1 ? 1 : t);
    var f = t * (RETURN_RAMP.length - 1);
    var i = Math.min(RETURN_RAMP.length - 2, Math.floor(f));
    var k = f - i, a = RETURN_RAMP[i], b = RETURN_RAMP[i + 1], out = "#";
    for (var ch = 1; ch < 7; ch += 2) {
      var av = parseInt(a.substr(ch, 2), 16), bv = parseInt(b.substr(ch, 2), 16);
      out += ("0" + Math.round(av + (bv - av) * k).toString(16)).slice(-2);
    }
    return out;
  }
  // Tableau stretches the ramp across the precincts actually present, so the
  // darkest precinct is the highest return rate, not an absolute 100%.
  function returnRate(cell) { return 100 * cell[0] / cell[1]; }
  // lo and hi are rounded to two places for display, so the lowest precinct can
  // sit a hair under lo. At the slider's floor nothing is cut, which is what
  // the legend says anyway.
  function belowCut(cell) {
    return returnYear && returnMin > returnYear.lo && returnRate(cell) < returnMin;
  }
  function returnFill(cell) {
    var lo = returnYear.lo, hi = returnYear.hi;
    return rampColor(hi > lo ? (returnRate(cell) - lo) / (hi - lo) : .5);
  }

  function electFill(cell) {
    if (!cell || cell[0] < 0) return TIED_COLOR;
    return RAMPS[cell[0] % RAMPS.length][cell[1]];
  }
  function electStyle(cell) {
    // A neutral hairline instead of the usual blue: at these fill strengths a
    // coloured precinct edge fights the fill it is drawn against.
    return { color: "#6b7280", weight: .8, opacity: .8,
             fillColor: electFill(cell), fillOpacity: .82 };
  }

  function styleFor(props) {
    if (returnYear) {
      var cell = returnYear.precincts[props.precinct];
      if (!cell) return HIDDEN;
      if (belowCut(cell)) return HIDDEN;
      return { stroke: true, fill: true,
               color: "#6b7280", weight: .8, opacity: .8,
               fillColor: returnFill(cell), fillOpacity: .85 };
    }
    if (contest) {
      var cell = contest.precincts[props.precinct];
      // A district race covers only its own precincts; the rest of the county
      // had no such contest on the ballot, so it drops back.
      return cell ? electStyle(cell) : DIMMED;
    }
    if (!filterKey) return BASE;
    return props[filterKey] === filterVal ? IN_DIST : DIMMED;
  }
  function hoverStyle(props) {
    if (!contest && !returnYear) return HOVER;
    var s = styleFor(props);
    return { color: "#1f2937", weight: 2.2, opacity: 1,
             fillColor: s.fillColor, fillOpacity: s.fillOpacity };
  }
  function restyleAll() {
    features.forEach(function (f) {
      if (f.layer !== picked) f.layer.setStyle(styleFor(f.props));
    });
  }

  var byNumber = {};
  var features = [];
  var picked = null;
  var addrMarker = null;

  var detail = document.getElementById("detail");

  function hideDetail() {
    detail.hidden = true;
    document.body.classList.remove("has-detail");
  }

  function showDetail(p) {
    document.getElementById("dNum").textContent = p.precinct || "";
    document.getElementById("dHood").textContent = p.neighborhood || "";

    var stat = document.getElementById("dStat");
    if (typeof p.active === "number") {
      stat.className = "d-stat";
      stat.innerHTML =
        '<span class="v">' + commas(p.active) + "</span>" +
        '<span class="k">active voters</span>' +
        (typeof p.registered === "number"
          ? '<span class="sub">' + commas(p.registered) + " registered, " +
            commas(p.inactive || 0) + " inactive</span>"
          : "");
    } else {
      stat.className = "d-stat none";
      stat.textContent = "Registered voter count not loaded";
    }

    var rows = [
      // The DPS map changed in 2024, so a precinct that moved carries where it
      // used to be: that is the difference between the board this precinct
      // votes for now and the one it voted for in 2023.
      ["School Board", p.school_board,
       p.school_board_2023 ? "was " + p.school_board_2023 : ""],
      ["City Council", p.council],
      ["RTD", p.rtd],
      ["State House", p.house],
      ["State Senate", p.senate],
      ["Congress", p.cong]
    ].filter(function (r) { return r[1]; });

    document.getElementById("dRows").innerHTML = rows.map(function (r) {
      return '<span class="r"><span>' + r[0] + "</span><b>" + esc(r[1]) + "</b>" +
             (r[2] ? '<span class="was">' + esc(r[2]) + "</span>" : "") + "</span>";
    }).join("");

    var el = document.getElementById("dElect");
    var cell = contest ? contest.precincts[p.precinct] : null;
    if (contest && cell) {
      el.innerHTML =
        '<span class="k">' + esc(contest.label) + "</span>" +
        '<span class="sw" style="background:' + electFill(cell) + '"></span>' +
        (cell[0] < 0
          ? "<b>Tied</b>"
          : "<b>" + esc(contest.cands[cell[0]]) + "</b> " +
            esc(elections.bands[cell[1]]));
      el.hidden = false;
    } else if (contest) {
      el.innerHTML = '<span class="k">' + esc(contest.label) +
                     "</span><b>Not on this ballot</b>";
      el.hidden = false;
    } else {
      el.hidden = true;
      el.innerHTML = "";
    }

    var rt = document.getElementById("dReturn");
    var rcell = returnYear ? returnYear.precincts[p.precinct] : null;
    var rhidden = rcell && belowCut(rcell);
    if (returnYear && rcell) {
      rt.innerHTML =
        '<span class="k">' + esc(returnYear.label) + "</span>" +
        '<span class="sw" style="background:' + returnFill(rcell) + '"></span>' +
        "<b>" + returnRate(rcell).toFixed(1) + "%</b> " +
        commas(rcell[0]) + " of " + commas(rcell[1]) +
        (rhidden ? ' <span class="was">below the cut</span>' : "");
      rt.hidden = false;
    } else {
      rt.hidden = true;
      rt.innerHTML = "";
    }

    document.getElementById("dCode").textContent =
      p.precinct_code ? "Code " + p.precinct_code : "";

    detail.hidden = false;
    document.body.classList.add("has-detail");
    document.body.style.setProperty("--detail-h", detail.offsetHeight + "px");
  }

  document.getElementById("detailClose").addEventListener("click", function () {
    hideDetail();
    if (picked) {
      picked.setStyle(styleFor((picked.feature && picked.feature.properties) || {}));
      picked = null;
    }
  });

  // Leave room at the bottom so the detail bar never sits on top of the shape.
  function fitPadding() {
    var extra = detail.hidden ? 0 : detail.offsetHeight + 16;
    return {
      paddingTopLeft: [40, 40],
      paddingBottomRight: [40, 40 + extra]
    };
  }

  function selectLayer(layer) {
    if (picked && picked !== layer) {
      picked.setStyle(styleFor((picked.feature && picked.feature.properties) || {}));
    }
    picked = layer;
    layer.setStyle(PICKED);
    layer.bringToFront();
    showDetail((layer.feature && layer.feature.properties) || {});
    var opts = fitPadding();
    opts.maxZoom = 16;
    opts.duration = .6;
    map.flyToBounds(layer.getBounds(), opts);
  }

  var layers = L.geoJSON(null, {
    style: function (feature) { return styleFor(feature.properties || {}); },
    onEachFeature: function (feature, layer) {
      var p = feature.properties || {};
      byNumber[String(p.precinct)] = layer;
      features.push({ props: p, layer: layer, geom: feature.geometry });
      layer.bindTooltip(String(p.precinct), { sticky: true, direction: "top", opacity: .9 });
      layer.on({
        mouseover: function () { if (layer !== picked) { layer.setStyle(hoverStyle(p)); layer.bringToFront(); } },
        mouseout:  function () { if (layer !== picked) layer.setStyle(styleFor(p)); },
        click:     function () {
          // clicking the selected precinct again lets it go
          if (layer === picked) { clearSelection(); say(""); return; }
          selectLayer(layer);
        }
      });
    }
  }).addTo(map);

  addOverlay(layers, "Precincts", "#2f6fa8");

  // ---- district zoom ---------------------------------------------------
  var DISTRICTS = [
    { key: "council",      el: "dCouncil", label: "council district" },
    { key: "school_board", el: "dSchool",  label: "school board district" },
    { key: "rtd",          el: "dRtd",     label: "RTD district" },
    { key: "senate",       el: "dSenate",  label: "state senate district" },
    { key: "house",        el: "dHouse",   label: "state house district" }
  ];

  function sortVals(a, b) {
    var na = parseFloat(a), nb = parseFloat(b);
    if (!isNaN(na) && !isNaN(nb)) return na - nb;
    return String(a).localeCompare(String(b));
  }

  function buildDistrictMenus() {
    DISTRICTS.forEach(function (d) {
      var sel = document.getElementById(d.el);
      var vals = [];
      features.forEach(function (f) {
        var v = f.props[d.key];
        if (v && vals.indexOf(v) === -1) vals.push(v);
      });
      vals.sort(sortVals);

      sel.innerHTML = '<option value="">All</option>' +
        vals.map(function (v) {
          return '<option value="' + esc(v) + '">' + esc(v) + "</option>";
        }).join("");

      sel.addEventListener("change", function () {
        var v = sel.value;
        DISTRICTS.forEach(function (o) {           // one district at a time
          if (o.el !== d.el) document.getElementById(o.el).value = "";
        });
        if (!v) { filterKey = filterVal = null; restyleAll(); zoomDenver(); return; }

        filterKey = d.key; filterVal = v;
        var bounds = null, n = 0, active = 0;
        features.forEach(function (f) {
          if (f.props[d.key] !== v) return;
          n += 1;
          active += f.props.active || 0;
          bounds = bounds ? bounds.extend(f.layer.getBounds()) : L.latLngBounds(f.layer.getBounds());
        });
        if (!bounds) { say("No precincts in that district.", true); return; }
        clearSelection();
        restyleAll();
        map.flyToBounds(bounds, { padding: [40, 40], duration: .7 });
        say(d.label.replace(/^./, function (c) { return c.toUpperCase(); }) + " " + v +
            ": " + n + " precinct" + (n === 1 ? "" : "s") +
            (active ? ", " + commas(active) + " active voters" : "") + ".");
        setCollapsed(true);   // get the panel out of the way of the map
      });
    });
  }

  function clearSelection() {
    if (picked) {
      picked.setStyle(styleFor((picked.feature && picked.feature.properties) || {}));
      picked = null;
    }
    hideDetail();
    if (addrMarker) { map.removeLayer(addrMarker); addrMarker = null; }
  }

  function resetDistrictMenus() {
    DISTRICTS.forEach(function (d) { document.getElementById(d.el).value = ""; });
    if (filterKey) { filterKey = filterVal = null; restyleAll(); }
  }

  function zoomDenver() {
    if (!layers.getLayers().length) return;
    map.flyToBounds(layers.getBounds(), { padding: [20, 20], duration: .7 });
  }

  document.getElementById("zoomDenver").addEventListener("click", function () {
    resetDistrictMenus();
    clearSelection();
    zoomDenver();
    say("");
    setCollapsed(true);
  });

  document.getElementById("reset").addEventListener("click", function () {
    if (boxOn) setBoxMode(false);
    document.getElementById("q").value = "";
    resetDistrictMenus();
    setContest(null);
    setReturnYear(null);
    clearSelection();
    zoomDenver();
    say("");
    setCollapsed(false);
    forgetView();
  });

  // ---- box zoom --------------------------------------------------------
  var boxBtn = document.getElementById("boxBtn");
  var boxOn = false, boxStart = null, boxRect = null;

  // Everything on the map goes inert while a box is being drawn: no panning,
  // no wheel or double-click zoom, and no hover, tooltip or click on precincts.
  var MAP_HANDLERS = ["dragging", "doubleClickZoom", "scrollWheelZoom",
                      "boxZoom", "keyboard", "touchZoom", "tap"];

  function setBoxMode(on) {
    boxOn = on;
    boxBtn.classList.toggle("on", on);
    boxBtn.textContent = on ? "Cancel box" : "Box zoom";
    map.getContainer().classList.toggle("boxzoom-on", on);

    MAP_HANDLERS.forEach(function (h) {
      if (map[h]) { on ? map[h].disable() : map[h].enable(); }
    });

    if (on) {
      features.forEach(function (f) {
        if (f.layer.closeTooltip) f.layer.closeTooltip();
        if (f.layer !== picked) f.layer.setStyle(styleFor(f.props));
      });
      say("Drag a box on the map to zoom into it.");
    } else {
      if (boxRect) { map.removeLayer(boxRect); boxRect = null; }
      boxStart = null;
    }
  }

  boxBtn.addEventListener("click", function () { setBoxMode(!boxOn); });

  function boxBegin(latlng) {
    boxStart = latlng;
    boxRect = L.rectangle(L.latLngBounds(boxStart, boxStart), {
      color: "#b4531f", weight: 1.5, dashArray: "4 3",
      fillColor: "#e08b3e", fillOpacity: .12, interactive: false
    }).addTo(map);
  }

  function boxDrag(latlng) {
    if (!boxStart || !boxRect) return;
    boxRect.setBounds(L.latLngBounds(boxStart, latlng));
  }

  function boxEnd(latlng) {
    if (!boxStart) return;
    var b = L.latLngBounds(boxStart, latlng);
    var px = map.latLngToContainerPoint(b.getNorthEast())
              .distanceTo(map.latLngToContainerPoint(b.getSouthWest()));
    setBoxMode(false);
    resetDistrictMenus();
    if (px < 12) { say("Box was too small. Try dragging a larger area."); return; }
    map.flyToBounds(b, { padding: [10, 10], duration: .6 });
    say("Zoomed to the selected area.");
    setCollapsed(true);
  }

  map.on("mousedown", function (e) { if (boxOn) boxBegin(e.latlng); });
  map.on("mousemove", function (e) { if (boxOn) boxDrag(e.latlng); });
  map.on("mouseup",   function (e) { if (boxOn) boxEnd(e.latlng); });

  // Leaflet's map mouse events do not fire for touch, so on a phone the box
  // never started. Read the touches off the container directly.
  function touchLatLng(ev) {
    var t = ev.touches[0] || ev.changedTouches[0];
    if (!t) return null;
    var r = map.getContainer().getBoundingClientRect();
    return map.containerPointToLatLng(
      L.point(t.clientX - r.left, t.clientY - r.top));
  }

  var mapEl = map.getContainer();
  mapEl.addEventListener("touchstart", function (ev) {
    if (!boxOn) return;
    var ll = touchLatLng(ev);
    if (!ll) return;
    ev.preventDefault();          // stop the page from scrolling under us
    boxBegin(ll);
  }, { passive: false });

  mapEl.addEventListener("touchmove", function (ev) {
    if (!boxOn || !boxStart) return;
    var ll = touchLatLng(ev);
    if (!ll) return;
    ev.preventDefault();
    boxDrag(ll);
  }, { passive: false });

  mapEl.addEventListener("touchend", function (ev) {
    if (!boxOn || !boxStart) return;
    var ll = touchLatLng(ev);
    if (!ll) return;
    ev.preventDefault();
    boxEnd(ll);
  }, { passive: false });

  mapEl.addEventListener("touchcancel", function () {
    if (boxOn) setBoxMode(false);
  });

  // ---- point in polygon (for address lookup) ---------------------------
  function ringHas(ring, lng, lat) {
    var inside = false;
    for (var i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      var xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
      if ((yi > lat) !== (yj > lat) &&
          lng < ((xj - xi) * (lat - yi)) / (yj - yi) + xi) {
        inside = !inside;
      }
    }
    return inside;
  }
  function polyHas(poly, lng, lat) {
    if (!poly.length || !ringHas(poly[0], lng, lat)) return false;
    for (var h = 1; h < poly.length; h++) {
      if (ringHas(poly[h], lng, lat)) return false;   // in a hole
    }
    return true;
  }
  function precinctAt(lat, lng) {
    for (var i = 0; i < features.length; i++) {
      var g = features[i].geom;
      if (!g) continue;
      if (g.type === "Polygon") {
        if (polyHas(g.coordinates, lng, lat)) return features[i];
      } else if (g.type === "MultiPolygon") {
        for (var k = 0; k < g.coordinates.length; k++) {
          if (polyHas(g.coordinates[k], lng, lat)) return features[i];
        }
      }
    }
    return null;
  }

  // ---- search: precinct number or street address -----------------------
  var findBtn = document.getElementById("findBtn");

  function findPrecinct(num) {
    var layer = byNumber[num];
    if (!layer) { say("No precinct " + num + " in Denver County.", true); return; }
    resetDistrictMenus();
    clearSelection();
    say("Showing precinct " + num + ".");
    selectLayer(layer);
    setCollapsed(true);   // clear the panel off the map once we have a result
  }

  function findAddress(q) {
    findBtn.disabled = true;
    say("Looking up that address…");
    fetch("/api/geocode?q=" + encodeURIComponent(q))
      .then(function (res) { return res.json().then(function (j) { return { ok: res.ok, j: j }; }); })
      .then(function (r) {
        if (!r.ok || r.j.error) throw new Error(r.j.error || "lookup failed");
        var lat = r.j.lat, lon = r.j.lon;
        var hit = precinctAt(lat, lon);
        resetDistrictMenus();
        clearSelection();
        addrMarker = L.circleMarker([lat, lon], {
          radius: 6, color: "#b4531f", weight: 2,
          fillColor: "#e08b3e", fillOpacity: .9, className: "addr-pin"
        }).addTo(map);

        if (!hit) {
          map.flyTo([lat, lon], 14, { duration: .6 });
          say("Found " + (r.j.name || q) + ", but it is outside Denver County precincts.", true);
          setCollapsed(true);
          return;
        }
        say(r.j.name ? r.j.name : q);
        selectLayer(hit.layer);
        setCollapsed(true);
      })
      .catch(function (err) {
        say("Could not find that address. " + err.message, true);
      })
      .then(function () { findBtn.disabled = false; });
  }

  // ---- district overlays -----------------------------------------------
  // Drawn at 4x the precinct line weight so they read clearly over the
  // precinct grid. Boundaries are dissolved from the precincts themselves, so
  // every district edge follows precinct edges exactly, and the converter
  // emits deduplicated boundary lines so a shared edge between two districts
  // is drawn once rather than twice (which would double its apparent weight).
  var maskLayer = null;

  var DISTRICT_LAYERS = [
    { key: "council", label: "City Council", color: "#0f766e" },
    { key: "school",  label: "School Board", color: "#7c3aed" },
    { key: "rtd",     label: "RTD",          color: "#a16207" },
    { key: "senate",  label: "State Senate", color: "#be123c" },
    { key: "house",   label: "State House",  color: "#0f172a" },
    { key: "nbhd",    label: "Neighborhoods", color: "#a21caf",
      small: true, minLabelZoom: 13 }
  ];

  function districtLabel(text, color, small) {
    return L.divIcon({
      className: "",
      html: '<span class="dlabel' + (small ? " small" : "") +
            '" style="color:' + color + '">' + esc(text) + "</span>",
      iconSize: null
    });
  }

  var districtsReady = fetch("{{ districts_url }}")
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status + " loading districts.geojson");
      return res.json();
    })
    .then(function (geo) {
      var feats = geo.features || [];

      // Everything outside the county greyed down, so Denver reads as the
      // subject rather than one shape among many.
      var maskFeat = feats.filter(function (f) {
        return f.properties && f.properties.kind === "mask";
      });
      if (maskFeat.length) {
        maskLayer = L.geoJSON({ type: "FeatureCollection", features: maskFeat }, {
          pane: "mask",
          interactive: false,
          style: { stroke: false, fillColor: "#334155", fillOpacity: .38 }
        }).addTo(map);
      }

      DISTRICT_LAYERS.forEach(function (d) {
        var outline = feats.filter(function (f) {
          return f.properties && f.properties.kind === "outline" &&
                 f.properties.layer === d.key;
        });
        if (!outline.length) return;

        var parts = [
          L.geoJSON({ type: "FeatureCollection", features: outline }, {
            pane: "districts",
            interactive: false,
            style: {
              color: d.color,
              weight: d.weight || 4,   // 4x the precinct weight of 1
              opacity: 1,
              fill: false,
              lineJoin: "round",
              lineCap: "round"
            }
          })
        ];

        feats.forEach(function (f) {
          var p = f.properties || {};
          if (p.kind !== "label" || p.layer !== d.key) return;
          var c = f.geometry.coordinates;
          parts.push(L.marker([c[1], c[0]], {
            icon: districtLabel(p.district, d.color, d.small),
            pane: "districtLabels",
            interactive: false,
            keyboard: false
          }));
        });

        d.layer = L.layerGroup(parts);
        addOverlay(d.layer, d.label, d.color);
      });

      // last in the list: a display treatment rather than a boundary
      if (maskLayer) addOverlay(maskLayer, "Dim outside Denver", null);

      syncLabels();
    })
    .catch(function (err) {
      console.error("[precinct-map] district outlines unavailable: " + err.message);
    });


  // ---- school board elections -------------------------------------------

  function buildLegend() {
    if (!contest) { electLegend.hidden = true; electLegend.innerHTML = ""; return; }

    // Only show the bands this contest actually produced. Every precinct in
    // the 2023 District 1 race fell in one band, and four swatches there would
    // suggest a spread that is not in the data.
    var used = {}, anyTied = false;
    for (var k in contest.precincts) {
      var cell = contest.precincts[k];
      if (cell[0] < 0) anyTied = true; else used[cell[1]] = true;
    }
    var bands = [];
    for (var i = 0; i < elections.bands.length; i++) if (used[i]) bands.push(i);

    var names = bands.map(function (b) { return elections.bands[b]; });
    var html = '<div class="lg-title">' + esc(contest.title) + ", " + contest.year +
               ". Denver publishes a 25% band per precinct, never a count.</div>" +
               '<div class="lg-scale">' +
               (names.length > 1
                 ? "Light to dark: " + esc(names.join(", "))
                 : "Every precinct fell in " + esc(names[0])) +

    contest.cands.forEach(function (name, ci) {

      html += '<div class="lg-row"><span class="lg-ramp">' +

  // ---- ballot returns UI -------------------------------------------------
  var returnRows = document.getElementById("returnRows");

  function setReturnYear(e, threshold) {
    returnYear = e || null;
    returnMin = returnYear
      ? Math.min(Math.max(threshold == null ? returnYear.lo : threshold,
                          returnYear.lo), returnYear.hi)
      : null;
    if (returnYear && contest) setContest(null);
    buildReturnLegend();
    restyleAll();

  var cutBar = null, cutText = null, cutCount = null, cutReset = null,
      cutSlider = null, cutPending = false;

  // Only the numbers and the cut marker change while dragging: rebuilding the
  // legend would tear the slider out from under the pointer.
  function paintCut() {
    if (!returnYear || !cutBar) return;
    var span = returnYear.hi - returnYear.lo;
    var frac = span > 0 ? (returnMin - returnYear.lo) / span : 0;
    cutBar.style.width = (100 * frac).toFixed(2) + "%";

    var shown = 0, total = 0;
    for (var k in returnYear.precincts) {
      total++;
      if (!belowCut(returnYear.precincts[k])) shown++;
    }
    cutText.innerHTML = returnMin > returnYear.lo
      ? "Showing <b>" + returnMin.toFixed(1) + "%</b> and up"
      : "Showing every precinct";
    cutCount.textContent = shown + " of " + total;
    cutReset.hidden = !(returnMin > returnYear.lo);
  }

  function buildReturnLegend() {
    cutBar = cutText = cutCount = cutReset = cutSlider = null;
    if (!returnYear) {
      returnLegend.hidden = true;
      returnLegend.innerHTML = "";
      return;
    }
    var stops = RETURN_RAMP.map(function (c, i) {
      return c + " " + Math.round(100 * i / (RETURN_RAMP.length - 1)) + "%";
    }).join(",");
    var rate = 100 * returnYear.cast / returnYear.issued;
    returnLegend.innerHTML =
      '<div class="lg-title">' + commas(returnYear.cast) + " of " +
      commas(returnYear.issued) + " ballots returned citywide, " +
      rate.toFixed(1) + "%.</div>" +
      '<div class="lg-bar" style="background:linear-gradient(to right,' +
      stops + ')"><i></i></div>' +
      '<input type="range" class="lg-slider" min="' + returnYear.lo +
      '" max="' + returnYear.hi + '" step="0.1" value="' + returnMin +
      '" aria-label="Hide precincts returning below this rate">' +
      '<div class="lg-ends"><span>' + returnYear.lo.toFixed(2) + "%</span>" +
      "<span>" + returnYear.hi.toFixed(2) + "%</span></div>" +
      '<div class="lg-cutline"><span class="t"></span>' +
      '<span><span class="n"></span> <button type="button" hidden>Show all</button></span></div>';

    cutBar = returnLegend.querySelector(".lg-bar i");
    cutText = returnLegend.querySelector(".lg-cutline .t");
    cutCount = returnLegend.querySelector(".lg-cutline .n");
    cutReset = returnLegend.querySelector(".lg-cutline button");
    cutSlider = returnLegend.querySelector(".lg-slider");

    cutSlider.addEventListener("input", function () {
      returnMin = parseFloat(cutSlider.value);
      paintCut();
      // 301 canvas polygons per pointer move is more than a frame can take,
      // so coalesce the restyle
      if (cutPending) return;
      cutPending = true;
      requestAnimationFrame(function () {
        cutPending = false;
        restyleAll();
      });
    });
    cutReset.addEventListener("click", function () {
      returnMin = returnYear.lo;
      cutSlider.value = returnMin;
      paintCut();
      restyleAll();
    });

    returnLegend.hidden = false;
    paintCut();
  }

  function returnRow(label, value, checked) {

    input.name = "returns";

    sw.className = "nosw";
    row.appendChild(sw);
    row.appendChild(document.createTextNode(label));

  var returnsReady = fetch("{{ returns_url }}")
    .then(function (r) {

      return r.json();

    .then(function (doc) {
      returns = doc;

      doc.elections.forEach(function (e) {

  // ---- big numbers on the map -------------------------------------------
  // 301 precinct numbers at county zoom is unreadable mush, and so is 78
  // neighbourhood names, so both only appear once there is room to place
  // them. Each has a checkbox of its own on top of that.
  var PRECINCT_LABEL_ZOOM = 14;
  var showPrecinctLabels = true;
  var showDistrictLabels = true;
  var precinctLabels = L.layerGroup([]);

  function buildPrecinctLabels() {
    features.forEach(function (f) {
      var p = f.props;
      if (!p.label) return;
      precinctLabels.addLayer(L.marker([p.label[1], p.label[0]], {
        icon: districtLabel(p.precinct, "#1d5687", true),
        pane: "districtLabels",
        interactive: false,
        keyboard: false
      }));
    });
  }

  function syncLabels() {
    DISTRICT_LAYERS.forEach(function (d) {
      if (!d.layer) return;
      var zoomOK = !d.minLabelZoom || map.getZoom() >= d.minLabelZoom;
      var show = showDistrictLabels && zoomOK;
      d.layer.eachLayer(function (l) {
        if (l.getElement && l.getElement()) {
          l.getElement().style.display = show ? "" : "none";
        }
      });
    });

    var wantPrecincts = showPrecinctLabels &&
                        map.getZoom() >= PRECINCT_LABEL_ZOOM &&
                        map.hasLayer(layers);
    if (wantPrecincts && !map.hasLayer(precinctLabels)) {
      map.addLayer(precinctLabels);
    } else if (!wantPrecincts && map.hasLayer(precinctLabels)) {
      map.removeLayer(precinctLabels);
    }
    map.getContainer().classList.toggle("pnum-on", wantPrecincts);
  }

  function addLabelToggle(label, get, set) {
    var host = document.getElementById("labelRows");
    var row = document.createElement("label");
    var input = document.createElement("input");
    input.type = "checkbox";
    input.checked = get();
    input.addEventListener("change", function () {
      set(input.checked);
      syncLabels();
    });
    row.appendChild(input);
    var sw = document.createElement("span");
    sw.className = "nosw";
    row.appendChild(sw);
    row.appendChild(document.createTextNode(label));
    host.appendChild(row);
  }

  addLabelToggle("Precinct numbers",
    function () { return showPrecinctLabels; },
    function (v) { showPrecinctLabels = v; });
  addLabelToggle("District numbers",
    function () { return showDistrictLabels; },
    function (v) { showDistrictLabels = v; });

  map.on("zoomend layeradd layerremove", syncLabels);

  // ---- remember where you left off --------------------------------------
  // Per browser, not per account: localStorage on this origin. A /s/ link
  // always wins over it, so a link someone sends opens on their view rather
  // than snapping back to whatever this browser last had.
  var VIEW_KEY = "denver-precinct-map:lastView";
  var saveTimer = null;

  function saveView() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try {
        localStorage.setItem(VIEW_KEY, encodeState());
      } catch (err) {
        /* private browsing, or storage disabled: not worth bothering about */
      }
    }, 400);
  }

  function readSavedView() {
    try {
      return localStorage.getItem(VIEW_KEY);
    } catch (err) {
      return null;
    }
  }

  function forgetView() {
    try {
      localStorage.removeItem(VIEW_KEY);
    } catch (err) {}
  }

  // ---- shareable links --------------------------------------------------
  // State is encoded into the URL path itself rather than stored server-side:
  // Render's free tier has no persistent disk and the service sleeps, so a
  // table of short codes would not survive. Format, dot-separated:
  //   <layer bitmask base36> [.f<layer><value>] [.p<precinct>] [.z<zoom>@lat,lng]
  // e.g. "x.fs1.z12@39.7325,-104.9540" = State House on, School Board 1.
  var LAYER_BITS = [
    { bit: 1,  get: function () { return maskLayer; } },
    { bit: 2,  key: "council" },
    { bit: 4,  key: "school" },
    { bit: 8,  key: "rtd" },
    { bit: 16, key: "senate" },
    { bit: 32, key: "house" },
    { bit: 64, key: "nbhd" },
    // Inverted on purpose: the bit means "precincts hidden", so share links
    // created before the precincts were toggleable still open with them on.
    { bit: 128, get: function () { return layers; }, invert: true }
  ];
  // NB: the filter selectors key off the precinct property names
  // (school_board), while the overlay layers key off the layer names
  // (school). These codes follow the selector keys.
  var FILTER_CODE = { council: "c", school_board: "s", rtd: "r",
                      senate: "e", house: "h" };
  var CODE_FILTER = { c: "council", s: "school_board", r: "rtd",
                      e: "senate", h: "house" };

  function layerFor(key) {
    for (var i = 0; i < DISTRICT_LAYERS.length; i++) {
      if (DISTRICT_LAYERS[i].key === key) return DISTRICT_LAYERS[i].layer;
    }
    return null;
  }

  function encodeState() {
    var bits = 0;
    LAYER_BITS.forEach(function (b) {
      var lyr = b.get ? b.get() : layerFor(b.key);
      if (!lyr) return;
      var on = map.hasLayer(lyr);
      if (b.invert ? !on : on) bits |= b.bit;
    });

    var out = [bits.toString(36)];
    if (filterKey && filterVal && FILTER_CODE[filterKey]) {
      out.push("f" + FILTER_CODE[filterKey] + filterVal);
    }
    if (contest) out.push("e" + contest.key);
    if (returnYear) {
      out.push("b" + returnYear.key);
      if (returnMin > returnYear.lo) out.push("t" + returnMin.toFixed(1));
    }
    if (picked && picked.feature && picked.feature.properties) {
      out.push("p" + picked.feature.properties.precinct);
    }
    var c = map.getCenter();
    out.push("z" + map.getZoom() + "@" + c.lat.toFixed(4) + "," + c.lng.toFixed(4));
    return out.join("~");
  }

  function applyState(code) {
    // Segments are separated by "~". An earlier build used "." which also
    // appears inside the coordinates, so the view never parsed; links in
    // that older form are still read for their layers, filter and precinct.
    code = String(code || "");
    var segs = code.indexOf("~") >= 0 ? code.split("~") : code.split(".");

    var bits = parseInt(segs[0], 36);
    if (!isNaN(bits)) {
      LAYER_BITS.forEach(function (b) {
        var lyr = b.get ? b.get() : layerFor(b.key);
        if (!lyr) return;
        var set = (bits & b.bit) !== 0;
        var want = b.invert ? !set : set;
        if (want && !map.hasLayer(lyr)) map.addLayer(lyr);
        if (!want && map.hasLayer(lyr)) map.removeLayer(lyr);
      });
    }

    var view = null, wantFilter = null, wantPrecinct = null, wantContest = null,
        wantReturn = null, wantCut = null;
    segs.slice(1).forEach(function (seg) {
      if (seg.charAt(0) === "e") {
        wantContest = seg.slice(1);
      } else if (seg.charAt(0) === "b") {
        wantReturn = seg.slice(1);
      } else if (seg.charAt(0) === "t") {
        wantCut = parseFloat(seg.slice(1));
      } else if (seg.charAt(0) === "f") {
        var key = CODE_FILTER[seg.charAt(1)];
        if (key) wantFilter = { key: key, val: seg.slice(2) };
      } else if (seg.charAt(0) === "p") {
        wantPrecinct = seg.slice(1);
      } else if (seg.charAt(0) === "z") {
        var m = seg.match(/^z(\d+)@(-?[\d.]+),(-?[\d.]+)$/);
        if (m) view = { zoom: +m[1], lat: +m[2], lng: +m[3] };
      }
    });

    if (wantFilter) {
      var sel = null;
      DISTRICTS.forEach(function (d) {
        if (d.key === wantFilter.key) sel = document.getElementById(d.el);
      });
      if (sel) {
        sel.value = wantFilter.val;
        sel.dispatchEvent(new Event("change", { bubbles: true }));
        var sec = document.getElementById("distSec");
        if (sec) {
          sec.classList.remove("closed");
          var btn = sec.querySelector("h2 button");
          if (btn) btn.setAttribute("aria-expanded", "true");
        }
      }
    }
    if (wantContest && byContest[wantContest]) {
      setContest(byContest[wantContest]);
      var esec = document.getElementById("electSec");
      if (esec) {
        esec.classList.remove("closed");
        var ebtn = esec.querySelector("h2 button");
        if (ebtn) ebtn.setAttribute("aria-expanded", "true");
      }
    }
    if (wantReturn && byReturn[wantReturn]) {
      setReturnYear(byReturn[wantReturn], isNaN(wantCut) ? null : wantCut);
      var rsec = document.getElementById("returnSec");
      if (rsec) {
        rsec.classList.remove("closed");
        var rbtn = rsec.querySelector("h2 button");
        if (rbtn) rbtn.setAttribute("aria-expanded", "true");
      }
    }
    if (wantPrecinct && byNumber[wantPrecinct]) {
      selectLayer(byNumber[wantPrecinct]);
    }
    if (view && !wantPrecinct) {
      map.setView([view.lat, view.lng], view.zoom, { animate: false });
    }
    if (wantFilter || wantPrecinct || wantContest || wantReturn) setCollapsed(true);
  }

  function describeState() {
    var bits = [];
    DISTRICT_LAYERS.forEach(function (d) {
      if (d.layer && map.hasLayer(d.layer)) bits.push(d.label);
    });
    var out = bits.length ? bits.join(", ") + (bits.length > 1 ? " layers" : " layer")
                          : "No district layers";
    if (filterKey && filterVal) {
      var label = filterKey;
      DISTRICTS.forEach(function (d) { if (d.key === filterKey) label = d.label; });
      out += " \u00b7 " + label.replace(/^./, function (c) { return c.toUpperCase(); }) +
             " " + filterVal;
    }
    if (contest) out += " \u00b7 " + contest.title + " " + contest.year;
    if (returnYear) {
      out += " \u00b7 " + returnYear.label + " ballot returns";
      if (returnMin > returnYear.lo) out += " from " + returnMin.toFixed(1) + "%";
    }
    if (picked && picked.feature && picked.feature.properties) {
      out += " \u00b7 precinct " + picked.feature.properties.precinct;
    }
    return out;
  }

  var shareModal = document.getElementById("shareModal");
  var shareUrl = document.getElementById("shareUrl");
  var shareCopy = document.getElementById("shareCopy");

  function openShare() {
    shareUrl.value = location.origin + "/s/" + encodeState();
    document.getElementById("shareWhat").textContent = describeState();
    shareCopy.textContent = "Copy";
    shareCopy.className = "";
    shareModal.hidden = false;
    shareUrl.focus();
    shareUrl.select();
  }
  function closeShare() { shareModal.hidden = true; }

  // fold the layer sections away by default; they are reference, not controls
  Array.prototype.forEach.call(
    document.querySelectorAll(".sec.fold h2 button"),
    function (btn) {
      btn.addEventListener("click", function () {
        var sec = btn.closest(".sec");
        var closed = sec.classList.toggle("closed");
        btn.setAttribute("aria-expanded", closed ? "false" : "true");
      });
    }
  );

  document.getElementById("share").addEventListener("click", openShare);
  document.getElementById("shareClose").addEventListener("click", closeShare);
  shareModal.addEventListener("click", function (e) {
    if (e.target === shareModal) closeShare();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !shareModal.hidden) closeShare();
  });
  shareCopy.addEventListener("click", function () {
    shareUrl.select();
    var done = function () {
      shareCopy.textContent = "Copied";
      shareCopy.className = "ok";
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(shareUrl.value).then(done, function () {
        try { document.execCommand("copy"); done(); } catch (err) {
          shareCopy.textContent = "Press \u2318C";
        }
      });
    } else {
      try { document.execCommand("copy"); done(); } catch (err) {
        shareCopy.textContent = "Press \u2318C";
      }
    }
  });

  // ---- load ------------------------------------------------------------
  var precinctsReady = fetch("{{ data_url }}")
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status + " loading precincts.geojson");
      return res.json();
    })
    .then(function (geo) {
      layers.addData(geo);
      var n = (geo.features || []).length;
      var active = (geo.features || []).reduce(function (sum, f) {
        var a = f.properties && f.properties.active;
        return sum + (typeof a === "number" ? a : 0);
      }, 0);
      document.getElementById("count").textContent =
        n + " precinct" + (n === 1 ? "" : "s") +
        (active ? " · " + commas(active) + " active voters" : " · Denver County");
      buildDistrictMenus();
      buildPrecinctLabels();
      syncLabels();
      map.fitBounds(layers.getBounds(), { padding: [20, 20] });
      say("Click any precinct to zoom in and see its details.");
    })
    .catch(function (err) {
      document.getElementById("count").textContent = "Precinct data unavailable";
      say("Could not load precinct boundaries. " + err.message, true);
    });

  // A /s/<code> URL restores that view; otherwise pick up where this browser
  // left off. Either way, start remembering once the map has settled.
  var shared = location.pathname.match(/^\/s\/(.+)$/);
  Promise.all([precinctsReady, districtsReady]).then(function () {
    if (shared) {
      try {
        applyState(decodeURIComponent(shared[1]));
      } catch (err) {
        console.error("[precinct-map] could not read shared link: " + err.message);
        say("That shared link could not be read, showing the whole county.", true);
      }
    } else {
      var saved = readSavedView();
      if (saved) {
        try {
          applyState(saved);
        } catch (err) {
          console.error("[precinct-map] could not read the saved view: " + err.message);
          forgetView();
        }
      }
    }
    map.on("moveend zoomend layeradd layerremove", saveView);
  });
})();
</script>
</body>
</html>
