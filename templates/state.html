<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colorado Legislative Districts</title>
{% if ga_id %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ ga_id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag("js", new Date());
  gtag("config", "{{ ga_id }}", { send_page_view: false, anonymize_ip: true });
  gtag("event", "page_view", {
    page_path: {{ ga_path|tojson }},
    page_title: document.title
  });
</script>
{% endif %}
<link rel="stylesheet" href="{{ url_for('static', filename='leaflet/leaflet.css') }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232f6fa8'/%3E%3Cpath d='M6 20l7-11 6 8 3-4 4 7z' fill='%23cfe2f0'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#1c2430; --muted:#6b7684; --line:#dde3ea; --panel:#ffffff;
    --accent:#2f6fa8; --accent-soft:#4a90c4; --wash:#f2f6fa;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
       Helvetica,Arial,sans-serif;color:var(--ink)}
  #map{position:absolute;inset:0;background:#eef1f4}

  .panel{
    position:absolute;top:14px;left:14px;z-index:1000;width:272px;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 6px 24px rgba(20,30,45,.12);
  }
  .panel h1{margin:0;padding:13px 15px 11px;font-size:15px;font-weight:650;
    letter-spacing:.1px;position:relative}
  .panel h1 span{display:block;font-size:11.5px;font-weight:450;
    color:var(--muted);margin-top:2px;letter-spacing:.2px}
  .panel .hlinks{display:flex;align-items:center;gap:11px;margin-top:8px;
    font-weight:450}
  .panel .link{padding:0 2px;font:inherit;font-size:12.5px;font-weight:500;
    color:var(--accent);background:none;border:0;cursor:pointer;
    text-decoration:underline;text-underline-offset:2px}
  .panel .link:hover{color:#27608f}
  .panel .note{padding:0 15px 13px;font-size:12.5px;color:var(--muted)}

  .detail{
    position:absolute;left:14px;bottom:14px;z-index:1000;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 6px 24px rgba(20,30,45,.12);
    padding:11px 40px 11px 14px;display:flex;align-items:center;gap:15px;
  }
  .detail .face{width:68px;height:68px;flex:none;border-radius:8px;
    overflow:hidden;background:var(--wash);box-shadow:0 0 0 1px rgba(0,0,0,.09)}
  .detail .face[hidden]{display:none}
  .detail .face img{width:100%;height:100%;display:block;object-fit:cover;
    object-position:50% 16%}
  .detail .face .ini{display:flex;width:100%;height:100%;align-items:center;
    justify-content:center;font-size:21px;font-weight:600;color:#8d96a2;
    letter-spacing:.02em}
  .detail[hidden]{display:none}
  .detail .num{font-size:21px;font-weight:650;font-variant-numeric:tabular-nums}
  .detail .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted)}
  .detail .stat{font-size:12.5px;color:var(--muted);
    font-variant-numeric:tabular-nums}
  .detail .who{padding-left:14px;border-left:1px solid var(--line)}
  .detail .name{font-size:15px;font-weight:600;white-space:nowrap}
  .detail .name .party{font-weight:500;color:var(--muted)}
  .detail .note{font-size:11px;color:var(--muted);max-width:240px;white-space:normal}
  .detail .note[hidden]{display:none}
  .panel .row{padding:0 15px 12px}
  .rosterbtn{width:100%;display:flex;align-items:center;justify-content:space-between;
    gap:8px;padding:8px 10px;font:inherit;font-size:13px;color:var(--ink);
    background:#fbfcfd;border:1px solid var(--line);border-radius:6px;
    cursor:pointer;text-align:left}
  .rosterbtn:hover{border-color:var(--accent-soft)}
  .rosterbtn:focus-visible{outline:none;border-color:var(--accent-soft);
    box-shadow:0 0 0 3px rgba(74,144,196,.15)}
  .rosterbtn .chev{color:var(--muted);font-size:11px;flex:none;
    transition:transform .15s}
  .rosterbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .roster{margin-top:7px;border:1px solid var(--line);border-radius:8px;
    background:#fff;overflow:hidden}
  .roster[hidden]{display:none}
  .roster input{width:100%;padding:8px 10px;font:inherit;font-size:12.5px;
    border:0;border-bottom:1px solid var(--line);background:#fbfcfd;color:var(--ink)}
  .roster input:focus{outline:none;background:#fff}
  .roster ul{margin:0;padding:0;list-style:none;max-height:362px;overflow-y:auto}
  .roster li button{display:flex;align-items:center;gap:10px;width:100%;
    padding:6px 9px;font:inherit;background:none;border:0;cursor:pointer;
    text-align:left;color:var(--ink)}
  .roster li button:hover{background:var(--wash)}
  .roster li button.on{background:#e7f0f8}
  /* Portraits are head-and-shoulders on a tall frame, so the square crop is
     biased upward -- centred, it cuts the face in half. */
  .roster .pic{width:51px;height:51px;flex:none;border-radius:6px;
    object-fit:cover;object-position:50% 16%;background:var(--wash);
    box-shadow:0 0 0 1px rgba(0,0,0,.08)}
  .roster .ini{display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:600;color:#8d96a2;letter-spacing:.02em}
  .roster .txt{min-width:0}
  .roster .nm{font-size:12.5px;font-weight:550;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .roster .sub{font-size:11px;color:var(--muted)}
  .roster .dot{width:7px;height:7px;border-radius:50%;flex:none;margin-left:auto}
  .rosternone{margin:0;padding:11px;font-size:12px;color:var(--muted)}
  .rosternone[hidden]{display:none}
  .legend{display:flex;gap:16px;padding:0 15px 12px;font-size:12px;
    color:var(--muted)}
  .legend[hidden]{display:none}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:2px;
    margin-right:5px;vertical-align:-1px;box-shadow:0 0 0 1px rgba(0,0,0,.14)}
  .chamber{display:flex;gap:6px;padding:0 15px 12px}
  .chamber button{flex:1;padding:7px 8px;font:inherit;font-size:12.5px;font-weight:550;
    color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:6px;
    cursor:pointer}
  .chamber button:hover{border-color:var(--accent-soft);color:var(--accent)}
  .chamber button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  @media (max-width:700px){
    .detail{flex-wrap:wrap;gap:8px 14px}
    .detail .who{padding-left:0;border-left:0}
  }
  .detail button{position:absolute;top:9px;right:9px;width:24px;height:24px;
    padding:0;font-size:16px;line-height:1;color:var(--muted);background:#fff;
    border:1px solid var(--line);border-radius:6px;cursor:pointer}
  .detail button:hover{border-color:var(--accent-soft);color:var(--accent)}

  .dnum{
    font:700 12px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
         Helvetica,Arial,sans-serif;
    color:#13406b;white-space:nowrap;
    -webkit-text-stroke:3px rgba(255,255,255,.92);paint-order:stroke fill;
  }
  .verbadge{background:rgba(255,255,255,.85);border-radius:3px;padding:1px 6px;
    font-size:10.5px;line-height:1.5;color:#7a828c;
    font-variant-numeric:tabular-nums;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
  .leaflet-container{font:inherit}
  .leaflet-control-zoom{border-radius:8px;border:1px solid var(--line);
    box-shadow:0 4px 16px rgba(20,30,45,.12);overflow:hidden}

  @media (max-width:700px){
    .panel{width:auto;left:10px;right:64px;top:10px}
    .detail{left:10px;right:10px;bottom:10px}
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="panel">
  <h1>
    Colorado Legislative Districts
    <span id="count">Loading districts&hellip;</span>
    <span class="hlinks">
      <a class="link" href="/">Denver precinct map</a>
      <button type="button" id="reset" class="link">Reset view</button>
    </span>
  </h1>
  <div class="chamber" id="chamber">
    <button type="button" data-ch="house" class="on">House &middot; 65</button>
    <button type="button" data-ch="senate">Senate &middot; 35</button>
  </div>
  <div class="row">
    <button type="button" id="rosterBtn" class="rosterbtn"
            aria-expanded="false" aria-controls="roster">
      <span id="rosterLabel">Zoom to a district</span>
      <span class="chev" aria-hidden="true">&#9662;</span>
    </button>
    <div class="roster" id="roster" hidden>
      <input id="rosterQ" type="text" autocomplete="off"
             placeholder="Filter by name or number" aria-label="Filter districts">
      <ul id="rosterList"></ul>
      <p class="rosternone" id="rosterNone" hidden>No match.</p>
    </div>
  </div>
  <div class="chamber" id="shade">
    <button type="button" data-mode="mix" class="on" aria-pressed="true">Mixed colors</button>
    <button type="button" data-mode="party" aria-pressed="false">By party</button>
  </div>
  <div class="legend" id="legend" hidden>
    <span><i style="background:#5b8fc9"></i><span id="legD">Democrat</span></span>
    <span><i style="background:#d4786f"></i><span id="legR">Republican</span></span>
  </div>
  <div class="note" id="note">Click any district to zoom in and see its number.</div>
</div>

<div class="detail" id="detail" hidden>
  <button type="button" id="detailClose" aria-label="Close">&times;</button>
  <div class="face" id="dFace" hidden></div>
  <div>
    <div class="lbl" id="dLbl">House District</div>
    <div class="num" id="dNum"></div>
  </div>
  <div class="who">
    <div class="lbl">Current member</div>
    <div class="name" id="dWho">&mdash;</div>
    <div class="note" id="dNote" hidden></div>
  </div>
  <div class="stat" id="dArea"></div>
</div>

<script src="{{ url_for('static', filename='leaflet/leaflet.js') }}"></script>
<script>
(function () {
  "use strict";

  function track(name, params) {
    if (typeof gtag !== "function") return;
    try { gtag("event", name, params || {}); } catch (e) {}
  }

  var map = L.map("map", {
    center: [39.0, -105.55], zoom: 7, minZoom: 6, maxZoom: 14,
    zoomControl: false, preferCanvas: true,
    zoomSnap: .5, zoomDelta: .5
  });
  L.control.zoom({ position: "topright" }).addTo(map);
  L.control.scale({ imperial: true, metric: false, position: "bottomright" }).addTo(map);

  L.tileLayer(
    "https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/" +
      "World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",
    { attribution:
        'Tiles &copy; <a href="https://www.esri.com/">Esri</a> | ' +
        'Districts: U.S. Census Bureau TIGER/Line 2024',
      maxNativeZoom: 16, maxZoom: 14 }
  ).addTo(map);

  var VersionBadge = L.Control.extend({
    onAdd: function () {
      var el = L.DomUtil.create("div", "verbadge");
      el.textContent = "v{{ version }}";
      return el;
    }
  });
  new VersionBadge({ position: "bottomright" }).addTo(map);

  // Numbers go in their own pane above the fills, so a selected district
  // brought to the front can never cover them.
  map.createPane("dlabels");
  map.getPane("dlabels").style.zIndex = 460;
  map.getPane("dlabels").style.pointerEvents = "none";

  // Five hues cycled by district number. With 65 districts a unique colour
  // each would be indistinguishable mud; what matters is that neighbours
  // differ, and the number is printed on every one anyway.
  var FILL = ["#9ec6e4", "#a9d8c4", "#f0cf9a", "#c9b8e0", "#e9b4ae"];

  // By-party shading. Muted rather than saturated: at statewide zoom a
  // full-strength red and blue fight the district numbers printed on top of
  // them, and the point is to read the pattern, not to shout.
  var PARTY_FILL = { D: "#5b8fc9", R: "#d4786f",
                     I: "#bda8d8", U: "#bda8d8", L: "#e6cb8d" };
  var NO_PARTY = "#cfd6dd";       // member list missing or not yet loaded
  var shadeMode = "mix";

  function partyOf(d) {
    var row = members && members[chamber] && members[chamber][String(d)];
    return row ? row[1] : null;
  }
  function fillFor(p) {
    if (shadeMode !== "party") return FILL[p.d % FILL.length];
    return PARTY_FILL[partyOf(p.d)] || NO_PARTY;
  }

  var BASE = function (p) {
    return { color: "#2f6fa8", weight: 1, opacity: .85,
             fillColor: fillFor(p), fillOpacity: .62 };
  };
  var HOVER = { color: "#13406b", weight: 2.5, opacity: 1, fillOpacity: .80 };
  // A function, not a constant: in party mode a selected district has to keep
  // its own colour, or picking a Republican seat would turn it blue.
  function PICKED(p) {
    return { color: "#13406b", weight: 3.5, opacity: 1,
             fillColor: fillFor(p), fillOpacity: .85 };
  }

  var CHAMBERS = {
    house:  { url: "{{ house_url }}",  label: "House District",
              short: "House",  n: 65 },
    senate: { url: "{{ senate_url }}", label: "Senate District",
              short: "Senate", n: 35 }
  };
  var PARTY = { D: "Democrat", R: "Republican", I: "Independent",
                U: "Unaffiliated", L: "Libertarian" };

  var chamber = "house";
  var cache = {};              // chamber -> {layers, labels, marks, byNum, home}
  var members = null;          // {house:{d:[name,party,note?]}, senate:{...}}
  var layers = null, labels = null, labelMarks = [], byNum = {};
  var picked = null, home = null;

  var note = document.getElementById("note");
  var detail = document.getElementById("detail");
  var countEl = document.getElementById("count");

  function say(msg) { note.textContent = msg; }
  var IDLE = "Click any district to zoom in and see its number.";

  // ---- detail bar ---------------------------------------------------------

  function fillMember(d) {
    fillFace(d);
    var who = document.getElementById("dWho");
    var noteEl = document.getElementById("dNote");
    var row = members && members[chamber] && members[chamber][String(d)];
    if (!row) {
      who.textContent = "—";
      noteEl.hidden = true;
      return;
    }
    var party = PARTY[row[1]] || row[1];
    who.textContent = "";
    who.appendChild(document.createTextNode(row[0] + " "));
    var tag = document.createElement("span");
    tag.className = "party";
    tag.textContent = "(" + party + ")";
    who.appendChild(tag);
    if (row[2]) { noteEl.textContent = row[2]; noteEl.hidden = false; }
    else { noteEl.hidden = true; }
  }

  function fillFace(d) {
    var face = document.getElementById("dFace");
    var row = members && members[chamber] && members[chamber][String(d)];
    face.textContent = "";
    if (!row) { face.hidden = true; return; }
    face.hidden = false;
    // Eager here, not lazy: the bar opens because someone asked for this one
    // district, so the portrait should be there when the panel appears.
    var node = avatar(row[0], photoFor(d), "", "ini");
    if (node.tagName === "IMG") node.loading = "eager";
    face.appendChild(node);
  }

  function show(layer) {
    if (picked && picked !== layer) picked.setStyle(BASE(picked.feature.properties));
    picked = layer;
    layer.bringToFront();
    var p = layer.feature.properties;
    layer.setStyle(PICKED(p));
    document.getElementById("dLbl").textContent = CHAMBERS[chamber].label;
    document.getElementById("dNum").textContent = p.d;
    document.getElementById("dArea").textContent =
      p.area.toLocaleString() + " square miles";
    fillMember(p.d);
    syncRosterLabel();
    markRoster();
    detail.hidden = false;
    map.flyToBounds(layer.getBounds(), { padding: [40, 40], duration: .7 });
    track("district_view", { chamber: chamber, district: p.d });
  }

  function clearPick() {
    if (picked) picked.setStyle(BASE(picked.feature.properties));
    picked = null;
    syncRosterLabel();
    markRoster();
    detail.hidden = true;
  }

  // ---- shading -----------------------------------------------------------

  function restyle() {
    Object.keys(byNum).forEach(function (d) {
      var lyr = byNum[d];
      lyr.setStyle(lyr === picked ? PICKED(lyr.feature.properties)
                                  : BASE(lyr.feature.properties));
    });
  }

  function partyCounts() {
    var m = (members && members[chamber]) || {}, c = {};
    Object.keys(m).forEach(function (d) {
      var k = m[d][1] || "?";
      c[k] = (c[k] || 0) + 1;
    });
    return c;
  }

  function syncLegend() {
    var legend = document.getElementById("legend");
    legend.hidden = shadeMode !== "party";
    if (legend.hidden) return;
    var c = partyCounts();
    document.getElementById("legD").textContent = "Democrat " + (c.D || 0);
    document.getElementById("legR").textContent = "Republican " + (c.R || 0);
  }

  var shadeBtns = Array.prototype.slice.call(
    document.querySelectorAll("#shade button"));
  shadeBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      shadeMode = b.getAttribute("data-mode");
      shadeBtns.forEach(function (x) {
        var on = x === b;
        x.classList.toggle("on", on);
        x.setAttribute("aria-pressed", on ? "true" : "false");
      });
      syncLegend();
      restyle();
      track("shade_mode", { mode: shadeMode, chamber: chamber });
    });
  });

  // ---- the roster --------------------------------------------------------

  // A dropdown of 65 numbers tells you nothing about who holds them, so this
  // is a list with the member's face on it. Portraits are hotlinked from
  // leg.colorado.gov, lazily, so the page costs nothing until the list is
  // opened; a seat whose holder has not been photographed yet -- usually a
  // recent vacancy appointment -- gets their initials instead.
  var rosterBtn = document.getElementById("rosterBtn");
  var rosterEl = document.getElementById("roster");
  var rosterList = document.getElementById("rosterList");
  var rosterQ = document.getElementById("rosterQ");
  var rosterLabel = document.getElementById("rosterLabel");
  var rosterNone = document.getElementById("rosterNone");
  var rosterRows = [];

  function initials(name) {
    var parts = String(name).split(/\s+/).filter(Boolean);
    if (!parts.length) return "?";
    var first = parts[0].charAt(0);
    var last = parts.length > 1 ? parts[parts.length - 1].charAt(0) : "";
    return (first + last).toUpperCase();
  }

  // Shared by the roster list and the detail bar, which size it differently;
  // imgClass/iniClass let each caller style its own.
  function avatar(name, url, imgClass, iniClass) {
    imgClass = imgClass === undefined ? "pic" : imgClass;
    iniClass = iniClass === undefined ? "pic ini" : iniClass;
    if (url) {
      var img = document.createElement("img");
      if (imgClass) img.className = imgClass;
      img.loading = "lazy";
      img.decoding = "async";
      img.referrerPolicy = "no-referrer";
      img.alt = "";
      img.src = url;
      // If the state's server is down or has moved the file, fall back rather
      // than leaving a broken-image box in the list.
      img.addEventListener("error", function () {
        if (img.parentNode) {
          img.parentNode.replaceChild(avatar(name, null, imgClass, iniClass), img);
        }
      });
      return img;
    }
    var box = document.createElement("span");
    box.className = iniClass;
    box.textContent = initials(name);
    return box;
  }

  function photoFor(d) {
    var pics = members && members.photos && members.photos[chamber];
    return (pics && pics[String(d)]) || "";
  }

  function buildRoster() {
    var m = (members && members[chamber]) || {};
    var pics = (members && members.photos && members.photos[chamber]) || {};
    rosterList.textContent = "";
    rosterRows = [];
    for (var i = 1; i <= CHAMBERS[chamber].n; i++) {
      var key = String(i), row = m[key];
      var name = row ? row[0] : "";
      var party = row ? row[1] : "";

      var li = document.createElement("li");
      var btn = document.createElement("button");
      btn.type = "button";
      btn.setAttribute("data-d", key);

      btn.appendChild(avatar(name, pics[key], "pic", "pic ini"));

      var txt = document.createElement("span");
      txt.className = "txt";
      var nm = document.createElement("span");
      nm.className = "nm";
      nm.textContent = name || "Vacant";
      var sub = document.createElement("span");
      sub.className = "sub";
      sub.textContent = CHAMBERS[chamber].short + " " + i +
                        (party ? " \u00b7 " + (PARTY[party] || party) : "");
      txt.appendChild(nm);
      txt.appendChild(document.createElement("br"));
      txt.appendChild(sub);
      btn.appendChild(txt);

      var dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = PARTY_FILL[party] || NO_PARTY;
      btn.appendChild(dot);

      li.appendChild(btn);
      rosterList.appendChild(li);
      rosterRows.push({ li: li, btn: btn, d: i,
                        hay: (i + " " + name + " " + party).toLowerCase() });
    }
    markRoster();
    filterRoster();
  }

  function markRoster() {
    var cur = picked && picked.feature ? String(picked.feature.properties.d) : null;
    rosterRows.forEach(function (r) {
      r.btn.classList.toggle("on", String(r.d) === cur);
    });
  }

  function filterRoster() {
    var q = rosterQ.value.trim().toLowerCase();
    var shown = 0;
    rosterRows.forEach(function (r) {
      var ok = !q || r.hay.indexOf(q) >= 0;
      r.li.hidden = !ok;
      if (ok) shown++;
    });
    rosterNone.hidden = shown > 0;
  }
  rosterQ.addEventListener("input", filterRoster);

  function openRoster(open) {
    rosterEl.hidden = !open;
    rosterBtn.setAttribute("aria-expanded", open ? "true" : "false");
    if (!open) return;
    rosterQ.value = "";
    filterRoster();
    rosterQ.focus();
    // Open on the selected member rather than at district 1, so reopening the
    // list after picking 58 does not mean scrolling back down to find it.
    var on = rosterList.querySelector("button.on");
    if (on) on.scrollIntoView({ block: "center" });
  }

  rosterBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    openRoster(rosterEl.hidden);
  });
  rosterEl.addEventListener("click", function (e) { e.stopPropagation(); });
  document.addEventListener("click", function () {
    if (!rosterEl.hidden) openRoster(false);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !rosterEl.hidden) { openRoster(false); rosterBtn.focus(); }
  });

  rosterList.addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest("button[data-d]") : null;
    if (!btn) return;
    var n = parseInt(btn.getAttribute("data-d"), 10);
    var lyr = byNum[n];
    openRoster(false);
    if (!lyr) { say(CHAMBERS[chamber].label + " " + n + " is not in the data."); return; }
    show(lyr);
    say("Showing " + CHAMBERS[chamber].label + " " + n + ".");
    track("district_search", { chamber: chamber, district: n });
  });

  function syncRosterLabel() {
    if (!picked || !picked.feature) {
      rosterLabel.textContent = "Zoom to a " +
        CHAMBERS[chamber].short.toLowerCase() + " district";
      return;
    }
    var d = picked.feature.properties.d;
    var row = members && members[chamber] && members[chamber][String(d)];
    rosterLabel.textContent = CHAMBERS[chamber].short + " " + d +
                              (row ? " \u00b7 " + row[0] : "");
  }
  document.getElementById("detailClose").addEventListener("click", clearPick);

  // ---- label de-confliction ----------------------------------------------

  // Statewide, the thirty-odd metro districts are a few pixels across and
  // their numbers land on top of one another. Rather than hide every number
  // until some arbitrary zoom, each is shown only if it has room, largest
  // district first. The rural seats stay labelled at the opening view and the
  // Front Range resolves as you zoom into it.
  function syncLabels() {
    if (!labelMarks.length) return;
    var size = map.getSize(), placed = [];
    labelMarks.slice()
      .sort(function (a, b) { return b.area - a.area; })
      .forEach(function (r) {
        var el = r.m.getElement && r.m.getElement();
        if (!el) return;
        var p = map.latLngToContainerPoint(r.ll);
        var hw = 6 + r.digits * 4.5, hh = 9;
        var ok = p.x > -30 && p.y > -30 && p.x < size.x + 30 && p.y < size.y + 30;
        for (var i = 0; ok && i < placed.length; i++) {
          var q = placed[i];
          if (Math.abs(p.x - q.x) < hw + q.hw && Math.abs(p.y - q.y) < hh + q.hh) ok = false;
        }
        el.style.display = ok ? "" : "none";
        if (ok) placed.push({ x: p.x, y: p.y, hw: hw, hh: hh });
      });
  }
  map.on("zoomend moveend", syncLabels);

  // ---- building a chamber ------------------------------------------------

  function build(ch, geo) {
    // featureGroup, not layerGroup: only a featureGroup can report the
    // combined bounds we need for the opening view and Reset.
    var g = { layers: L.featureGroup(), labels: L.layerGroup(),
              marks: [], byNum: {}, count: 0, home: null };

    geo.features.forEach(function (f) {
      var layer = L.geoJSON(f, {
        style: BASE(f.properties),
        onEachFeature: function (_, lyr) {
          var who = (members && members[ch] && members[ch][String(f.properties.d)]);
          lyr.bindTooltip(CHAMBERS[ch].label + " " + f.properties.d +
                          (who ? " \u00b7 " + who[0] + " (" + who[1] + ")" : ""),
                          { sticky: true, direction: "top", opacity: .9 });
          lyr.on({
            mouseover: function () { if (lyr !== picked) lyr.setStyle(HOVER); },
            mouseout:  function () { if (lyr !== picked) lyr.setStyle(BASE(f.properties)); },
            click: function () {
              if (lyr === picked) { clearPick(); say(IDLE); return; }
              show(lyr);
            }
          });
        }
      });
      layer.addTo(g.layers);
      g.byNum[f.properties.d] = layer.getLayers()[0];
      g.count++;

      var ll = L.latLng(f.properties.label[1], f.properties.label[0]);
      var mark = L.marker(ll, {
        icon: L.divIcon({ className: "", iconSize: null,
                          html: '<span class="dnum">' + f.properties.d + "</span>" }),
        pane: "dlabels", interactive: false, keyboard: false
      });
      g.labels.addLayer(mark);
      g.marks.push({ m: mark, ll: ll, area: f.properties.area,
                     digits: String(f.properties.d).length });
    });

    return g;
  }

  // ---- loading and switching ---------------------------------------------

  // The member list is small and shared by both chambers, so it is fetched
  // once alongside whichever chamber is asked for first.
  var membersReq = null;
  function getMembers() {
    if (!membersReq) {
      membersReq = fetch("{{ members_url }}")
        .then(function (res) { return res.ok ? res.json() : null; })
        .then(function (j) { members = j; return j; })
        .catch(function () { return null; });   // names are a nicety, not the map
    }
    return membersReq;
  }

  function detach() {
    if (layers) map.removeLayer(layers);
    if (labels) map.removeLayer(labels);
  }

  function attach(ch, fit) {
    var g = cache[ch];
    chamber = ch;
    layers = g.layers; labels = g.labels;
    labelMarks = g.marks; byNum = g.byNum; home = g.home;
    layers.addTo(map);
    labels.addTo(map);
    countEl.textContent = g.count + " " + CHAMBERS[ch].short.toLowerCase() +
                          " districts · 2024 boundaries";
    buildRoster();
    syncRosterLabel();
    syncLegend();
    restyle();
    if (fit && home) map.fitBounds(home, { padding: [20, 20] });
    syncLabels();
  }

  function load(ch) {
    if (cache[ch]) return Promise.resolve(cache[ch]);
    return Promise.all([
      fetch(CHAMBERS[ch].url).then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status + " loading " + ch + " districts");
        return res.json();
      }),
      getMembers()
    ]).then(function (out) {
      var g = build(ch, out[0]);
      // Bounds are computed once, while the group is briefly on the map,
      // because an un-added LayerGroup has no getBounds().
      g.layers.addTo(map);
      g.home = g.layers.getBounds();
      map.removeLayer(g.layers);
      cache[ch] = g;
      return g;
    });
  }

  var buttons = Array.prototype.slice.call(
    document.querySelectorAll("#chamber button"));

  function markButtons(ch) {
    buttons.forEach(function (b) {
      var on = b.getAttribute("data-ch") === ch;
      b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }

  var switching = false;
  function switchTo(ch, fit) {
    if (switching || ch === chamber && cache[ch]) return;
    switching = true;
    markButtons(ch);
    if (!cache[ch]) say("Loading " + CHAMBERS[ch].short.toLowerCase() + " districts…");
    load(ch).then(function () {
      clearPick();
      detach();
      attach(ch, fit !== false);
      say(IDLE);
      switching = false;
      track("chamber_switch", { chamber: ch });
    }).catch(function (err) {
      markButtons(chamber);
      countEl.textContent = "Could not load districts";
      say(String(err.message || err));
      switching = false;
    });
  }

  buttons.forEach(function (b) {
    b.addEventListener("click", function () {
      switchTo(b.getAttribute("data-ch"), true);
    });
  });

  document.getElementById("reset").addEventListener("click", function () {
    clearPick();
    if (home) map.flyToBounds(home, { padding: [20, 20], duration: .7 });
    say(IDLE);
  });

  markButtons(chamber);
  switchTo(chamber, true);
})();
</script>
</body>
</html>
